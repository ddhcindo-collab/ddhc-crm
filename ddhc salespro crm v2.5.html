<!-- ══════════ Script 10B：XLSX 原生讀取器 + 匯入來源格式（Profile） ══════════ -->
<script>
/* ═════════ XLSX 原生讀取器（純 JS・零外部依賴・離線可用） ═════════
   .xlsx = ZIP 容器：中央目錄 → entry 資料 → deflate-raw 解壓 → XML → DOMParser
   不用 SheetJS 等外部庫，維持「單一 HTML 檔・免安裝・離線可用」原則（見手冊 B1）
   支援：sharedStrings / inlineStr / 數值 / Excel 日期序號（依 styles.xml numFmt 判斷） */
const XLSX_SUPPORTED = (typeof DecompressionStream!=='undefined' && typeof DOMParser!=='undefined');

async function xlInflate(u8){
  if(typeof DecompressionStream==='undefined') throw new Error('瀏覽器不支援 DecompressionStream（請更新 Chrome / Edge）');
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function xlFindEOCD(u8){
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){
    if(u8[i]===0x50&&u8[i+1]===0x4B&&u8[i+2]===0x05&&u8[i+3]===0x06) return i;
  }
  return -1;
}
function xlReadZip(u8){
  const eocd=xlFindEOCD(u8);
  if(eocd<0) throw new Error('不是有效的 .xlsx（找不到 ZIP 結尾記錄）');
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const out={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder('utf-8').decode(u8.subarray(p+46,p+46+nlen));
    out[name]={method,csize,lho};
    p+=46+nlen+elen+clen;
  }
  return out;
}
async function xlExtract(zip,u8,name){
  const e=zip[name]; if(!e) return null;
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const nlen=dv.getUint16(e.lho+26,true), elen=dv.getUint16(e.lho+28,true);
  const start=e.lho+30+nlen+elen;
  const comp=u8.subarray(start,start+e.csize);
  if(e.method===0) return comp.slice();
  if(e.method===8) return await xlInflate(comp);
  throw new Error('不支援的 ZIP 壓縮方式：'+e.method);
}
function xlDecode(bytes){
  let s=new TextDecoder('utf-8').decode(bytes);
  if(s.charCodeAt(0)===0xFEFF) s=s.slice(1);
  return s;
}
function xlEnt(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,(m,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(m,d)=>String.fromCodePoint(+d)).replace(/&amp;/g,'&');
}
/* 極簡 XML 解析（自寫，不依賴 DOMParser／外部庫）：回傳迷你 DOM 節點
   節點 API：getAttribute / getElementsByTagName / children / text */
function xlParseXML(text){
  const root={tag:'#root',attrs:{},children:[],text:''};
  const stack=[root];
  const re=/<[^>]*>/g; let last=0,m;
  while((m=re.exec(text))){
    const seg=text.slice(last,m.index);
    if(seg) stack[stack.length-1].text+=xlEnt(seg);
    last=m.index+m[0].length;
    const raw=m[0];
    if(raw.charAt(1)==='?'||raw.charAt(1)==='!') continue;   // <?xml ?> / <!-- --> / <!DOCTYPE>
    if(raw.charAt(1)==='/'){ if(stack.length>1) stack.pop(); continue; }
    let inner=raw.slice(1,-1), self=false;
    if(inner.endsWith('/')){ self=true; inner=inner.slice(0,-1); }
    const sp=inner.search(/\s/);
    const tag=sp<0?inner:inner.slice(0,sp);
    const node={tag:tag,attrs:{},children:[],text:''};
    if(sp>=0){
      const ar=/([\w:.-]+)\s*=\s*("([^"]*)"|'([^']*)')/g; let a;
      while((a=ar.exec(inner.slice(sp)))) node.attrs[a[1]]=xlEnt(a[3]!==undefined?a[3]:a[4]);
    }
    stack[stack.length-1].children.push(node);
    if(!self) stack.push(node);
  }
  return xlBindDOM(root);
}
function xlBindDOM(node){
  node.getAttribute=n=>{ const v=node.attrs[n]; return v===undefined?null:v; };
  node.getElementsByTagName=tag=>{
    const out=[];
    (function walk(n){ for(const c of n.children){ if(c.tag===tag) out.push(c); walk(c); } })(node);
    return out;
  };
  node.textContent=()=>{ let s=node.text; for(const c of node.children) s+=c.textContent(); return s; };
  for(const c of node.children) xlBindDOM(c);
  return node;
}
/* 判斷 cellXfs 內哪些 style index 是日期格式（回傳 Set<styleIndex>） */
function xlDateStyles(doc){
  const custom={};
  const nfs=doc.getElementsByTagName('numFmt');
  for(let i=0;i<nfs.length;i++) custom[nfs[i].getAttribute('numFmtId')]=(nfs[i].getAttribute('formatCode')||'');
  const isDateFmt=id=>{
    if(id>=14&&id<=22) return true;   // 內建日期
    if(id>=27&&id<=36) return true;   // 內建 CJK 日期
    if(id>=45&&id<=47) return true;   // 內建時間
    if(id>=50&&id<=58) return true;
    const fc=custom[id]; if(!fc) return false;
    const s=fc.replace(/"[^"]*"/g,'').replace(/\[[^\]]*\]/g,'');
    return /[ymdhs]/i.test(s);
  };
  const set=new Set();
  const cxs=doc.getElementsByTagName('cellXfs');
  if(cxs.length){
    const list=cxs[0].children;
    for(let i=0;i<list.length;i++){
      const id=parseInt(list[i].getAttribute('numFmtId')||'0',10);
      if(isDateFmt(id)) set.add(i);
    }
  }
  return set;
}
/* Excel 日期序號 → YYYY-MM-DD（1900 日期系統；UTC 避免時區偏移） */
function xlSerialToDate(n){
  const d=new Date(Math.round((n-25569)*86400000));
  if(isNaN(d.getTime())) return '';
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}
function xlColIndex(ref){
  const m=/^([A-Z]+)/.exec(ref||''); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
function xlSharedStrings(doc){
  const out=[]; const sis=doc.getElementsByTagName('si');
  for(let i=0;i<sis.length;i++){
    let s=''; const ts=sis[i].getElementsByTagName('t');
    for(let j=0;j<ts.length;j++) s+=ts[j].textContent();
    out.push(s);
  }
  return out;
}
function xlParseSheet(doc,sst,dateStyles){
  const sds=doc.getElementsByTagName('sheetData');
  if(!sds.length) return [];
  const out=[];
  const rowEls=sds[0].children;
  for(let i=0;i<rowEls.length;i++){
    const row=rowEls[i]; const arr=[];
    const cs=row.children;
    for(let j=0;j<cs.length;j++){
      const c=cs[j];
      const col=xlColIndex(c.getAttribute('r'));
      const type=c.getAttribute('t')||'n';
      const sAttr=c.getAttribute('s');
      let val='';
      if(type==='inlineStr'){
        const iss=c.getElementsByTagName('is');
        if(iss.length){ const ts=iss[0].getElementsByTagName('t'); for(let k=0;k<ts.length;k++) val+=ts[k].textContent; }
      }else{
        const vs=c.getElementsByTagName('v');
        const raw=vs.length?vs[0].textContent():'';
        if(type==='s') val=(sst[+raw]!==undefined)?sst[+raw]:'';
        else if(type==='b') val=(raw==='1')?'TRUE':'FALSE';
        else if(type==='str'||type==='e') val=raw;
        else{
          const num=parseFloat(raw);
          if(sAttr!==null&&dateStyles.has(+sAttr)&&isFinite(num)) val=xlSerialToDate(num);
          else val=raw;
        }
      }
      arr[col]=val;
    }
    for(let k=0;k<arr.length;k++) if(arr[k]===undefined) arr[k]='';
    out.push(arr);
  }
  return out;
}
/* 讀取 .xlsx → [{name, rows:[ [cell,…], … ]}]（第一列 = 標題列） */
async function xlReadFile(file){
  const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf);
  const zip=xlReadZip(u8);
  if(!zip['xl/workbook.xml']) throw new Error('不是有效的 .xlsx（缺少 workbook.xml）');
  const sstBuf=await xlExtract(zip,u8,'xl/sharedStrings.xml');
  const sst=sstBuf?xlSharedStrings(xlParseXML(xlDecode(sstBuf))):[];
  const stBuf=await xlExtract(zip,u8,'xl/styles.xml');
  const dateStyles=stBuf?xlDateStyles(xlParseXML(xlDecode(stBuf))):new Set();
  const wb=xlParseXML(xlDecode(await xlExtract(zip,u8,'xl/workbook.xml')));
  const relMap={};
  const relBuf=await xlExtract(zip,u8,'xl/_rels/workbook.xml.rels');
  if(relBuf){
    const rd=xlParseXML(xlDecode(relBuf)); const rs=rd.getElementsByTagName('Relationship');
    for(let i=0;i<rs.length;i++) relMap[rs[i].getAttribute('Id')]=rs[i].getAttribute('Target');
  }
  const shEls=wb.getElementsByTagName('sheet');
  const sheets=[];
  for(let i=0;i<shEls.length;i++){
    const rid=shEls[i].getAttribute('r:id')||shEls[i].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid]||'';
    if(tgt.charAt(0)==='/') tgt=tgt.slice(1);
    else if(tgt.indexOf('xl/')!==0) tgt='xl/'+tgt.replace(/^\.\//,'');
    const sb=await xlExtract(zip,u8,tgt);
    if(!sb) continue;
    sheets.push({ name:shEls[i].getAttribute('name')||('Sheet'+(i+1)), rows:xlParseSheet(xlParseXML(xlDecode(sb)),sst,dateStyles) });
  }
  if(!sheets.length) throw new Error('此 .xlsx 沒有可讀取的工作表');
  return sheets;
}

/* ═════════ 匯入來源格式（Profile）：已知 Excel 版式 → 一鍵對映 CRM 欄位 ═════════
   cols   = CRM 欄位 → 來源欄名（支援 '欄名#2' = 同名第 2 欄）
   sum    = CRM 欄位 → 多個來源欄（相加）
   extra  = 來源欄名 → 寫入 rawNotes（Excel 原始備註，保留未對映資料）
   flags  = 來源欄名有值時 → 設定某 CRM 欄位（如取消申請日 → TERMINATED）
   labels = 備註顯示用欄名覆寫                                        */
/* ▼ IMPORT_PROFILES → crm-data.js */

/* ═════════ 匯入值轉換對照表（來源多格式 → CRM 內部碼） ═════════ */
/* ▼ VAL_* 匯入值對照 → crm-data.js */
function valLookup(v,map){
  const s=String(v==null?'':v).trim();
  if(!s) return '';
  if(map[s]!==undefined) return map[s];
  const k=s.toLowerCase();
  return map[k]!==undefined?map[k]:s;
}
/* 經驗年數解析：'13YRS 4 MONTHS'→13.33、'4 yrs'→4、'2007-2016'→9、'3MON'→0.25、'7.4'→7.4 */
function parseYearsText(v){
  const s=String(v==null?'':v).trim();
  if(!s) return 0;
  const rng=/^(\d{4})\s*[-–~]\s*(\d{4})$/.exec(s);
  if(rng) return Math.max(0,(+rng[2])-(+rng[1]));
  let y=0, mo=0;
  const ry=/(\d+(?:\.\d+)?)\s*(?:YRS?|YEARS?|年)/gi, rm=/(\d+(?:\.\d+)?)\s*(?:MONTHS?|MONS?|月)/gi;
  let m;
  while((m=ry.exec(s))) y+=parseFloat(m[1]);
  while((m=rm.exec(s))) mo+=parseFloat(m[1]);
  if(y||mo) return Math.round((y+mo/12)*100)/100;
  const nums=s.match(/\d+(?:\.\d+)?/g);
  return nums?parseFloat(nums[0]):0;
}
/* 電話國碼分流：+63/09→PH、+62/08→ID、+852→HK；裸號碼依國籍判斷
   （helper db 的 8 位裸號碼其實是當地固話：印尼 125 筆、菲籍 165 筆，故須用國籍判斷而非一律當香港號）
   回傳 cc：'PH' | 'ID' | 'HK' | 'OTHER' */
function classifyPhoneRaw(v,nat){
  const s=String(v==null?'':v).trim();
  if(!s) return {cc:''};
  const d=s.replace(/\D/g,'');
  if(!d) return {cc:''};
  const natCC = nat==='ID' ? '62' : nat==='PH' ? '63' : '';
  /* ① 明寫國際區碼 */
  if(s.charAt(0)==='+'){
    if(d.indexOf('852')===0) return {cc:'HK', num:'+'+d};
    if(d.indexOf('62')===0)  return {cc:'ID', num:'+'+d};
    if(d.indexOf('63')===0)  return {cc:'PH', num:'+'+d};
    return {cc:'OTHER', num:'+'+d};
  }
  /* ② 已有區碼但無 + */
  if(d.length>=10){
    if(d.indexOf('852')===0) return {cc:'HK', num:'+'+d};
    if(d.indexOf('62')===0)  return {cc:'ID', num:'+'+d};
    if(d.indexOf('63')===0)  return {cc:'PH', num:'+'+d};
  }
  /* ③ 本地 0 開頭格式（09…=菲、08…=印尼） */
  if(d.charAt(0)==='0'){
    const rest=d.replace(/^0+/,'');
    if(rest.charAt(0)==='9') return {cc:'PH', num:'63'+rest};
    if(rest.charAt(0)==='8') return {cc:'ID', num:'62'+rest};
    if(natCC) return {cc:nat==='ID'?'ID':'PH', num:natCC+rest};
    return {cc:'OTHER', num:s};
  }
  /* ④ 裸本地號碼：依國籍補國碼（保留原數字，只加前綴） */
  if(natCC) return {cc:nat==='ID'?'ID':'PH', num:natCC+d};
  if(d.length===8) return {cc:'HK', num:'852'+d};
  return {cc:'OTHER', num:s};
}
/* 依欄名找欄位索引（支援 '欄名#2' = 同名第 2 欄） */
function findColIndex(headers,spec){
  const m=/^(.*)#(\d+)$/.exec(spec);
  const name=(m?m[1]:spec).trim(), nth=m?+m[2]:1;
  let seen=0;
  for(let i=0;i<headers.length;i++){
    if(String(headers[i]).trim()===name){ seen++; if(seen===nth) return i; }
  }
  return -1;
}
/* 偵測來源格式（純看標題列；兩份 xlsx 各有獨有欄位，故不會互相誤判） */
function detectProfile(headers,kind){
  const hs=headers.map(h=>String(h).trim());
  for(const id in IMPORT_PROFILES){
    const p=IMPORT_PROFILES[id];
    let hit=true;
    for(const d of p.detect){ if(hs.indexOf(d)<0){ hit=false; break; } }
    if(hit) return id;
  }
  return '';
}
</script>

<!-- ══════════ Script 11：模組六 —— CSV 匯入 + 系統設定 ══════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════════
   自動同步資料夾（File System Access API）
   ───────────────────────────────────────────────────────────────────
   目的：揀一個資料夾（例如公司共用雲端硬碟 / Dropbox）做為「同步中樞」，
        之後唔使每次手動上載 JSON：
        · 開機時自動讀入資料夾內最新的 .json 備份（有更新先提示）
        · 每次改動後 debounce 自動寫出一份新備份
        限制：只支援桌面版 Chrome / Edge（file:// 亦可）；Firefox/Safari 不支援，
        系統會自動退回原有「手動上載／下載」流程，功能唔會壞。
   ═══════════════════════════════════════════════════════════════════ */
const FS_DIR_KEY = 'wb_crm_sync_dir';      // localStorage：資料夾名稱（顯示用）
const FS_IDB_NAME = 'wb_crm_fs';
const FS_STORE = 'handles';
const FS_AUTOSAVE = 'wb_crm_autosave';     // localStorage：是否自動寫出
const FS_SYNC_AT = 'wb_crm_sync_at';       // localStorage：最後一次與資料夾同步的時間（用於判斷新舊）
const FS_PREFIX = 'crm-autosync-';         // 自動寫出檔名前綴（只清理呢類，唔會郁用戶手動檔）
const FS_MAX_FILES = 20;                   // 自動備份檔保留上限

const FS_STATE = { handle:null, ready:false, supported:false, lastWrite:'', busy:false, timer:null };

function fsSupported(){ return typeof window.showDirectoryPicker === 'function' && typeof indexedDB !== 'undefined'; }
function fsSyncAt(){ try{ return localStorage.getItem(FS_SYNC_AT)||''; }catch(e){ return ''; } }
function fsSetSyncAt(v){ try{ localStorage.setItem(FS_SYNC_AT, v||''); }catch(e){} }

/* ── IndexedDB 儲存目錄 handle ── */
function fsIdbOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(FS_IDB_NAME, 1);
    r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore(FS_STORE); }catch(e){} };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function fsIdbSet(key, val){
  const db = await fsIdbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction(FS_STORE,'readwrite');
    tx.objectStore(FS_STORE).put(val, key);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}
async function fsIdbGet(key){
  const db = await fsIdbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction(FS_STORE,'readonly');
    const q = tx.objectStore(FS_STORE).get(key);
    q.onsuccess = ()=>res(q.result||null);
    q.onerror = ()=>rej(q.error);
  });
}
async function fsIdbDel(key){
  const db = await fsIdbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction(FS_STORE,'readwrite');
    tx.objectStore(FS_STORE).delete(key);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}

/* ── 權限：讀取權限需使用者操作才能重新授權 ── */
async function fsEnsurePermission(handle, mode){
  if(!handle || !handle.queryPermission) return false;
  try{
    let p = await handle.queryPermission({mode:mode||'read'});
    if(p==='granted') return true;
    if(handle.requestPermission){ p = await handle.requestPermission({mode:mode||'read'}); return p==='granted'; }
  }catch(e){ /* 忽略 */ }
  return false;
}

/* ── 揀資料夾（必須由使用者點擊觸發） ── */
async function fsPickFolder(){
  if(!fsSupported()){ toast('⚠ 此瀏覽器不支援自動同步資料夾（請用桌面版 Chrome / Edge）','error',6000); return null; }
  try{
    const h = await window.showDirectoryPicker({ mode:'readwrite', startIn:'documents' });
    FS_STATE.handle = h;
    await fsIdbSet('dir', h);
    try{ localStorage.setItem(FS_DIR_KEY, h.name); }catch(e){}
    try{ localStorage.setItem(FS_AUTOSAVE, '1'); }catch(e){}
    return h;
  }catch(e){
    if(e && e.name!=='AbortError') toast('⚠ 無法開啟資料夾：'+(e.message||e.name),'error',6000);
    return null;
  }
}

/* ── 取得已授權的 handle（開機時呼叫） ── */
async function fsRestoreHandle(){
  if(!fsSupported()) return null;
  try{
    const h = await fsIdbGet('dir');
    if(h){ FS_STATE.handle = h; FS_STATE.ready = true; return h; }
  }catch(e){}
  return null;
}

/* ── 列出資料夾內的 .json 檔（依修改時間排序，最新在前） ── */
async function fsListJson(){
  const h = FS_STATE.handle; if(!h) return [];
  const out = [];
  try{
    for await(const [name, handle] of h.entries()){
      if(handle.kind!=='file') continue;
      if(!/\.json$/i.test(name)) continue;
      try{ const f = await handle.getFile(); out.push({name, handle, size:f.size, mtime:f.lastModified}); }catch(e){}
    }
  }catch(e){ return out; }
  out.sort((a,b)=>b.mtime-a.mtime);
  return out;
}

/* ── 讀取某個 JSON 檔並還原 ── */
async function fsRestoreFromFile(entry, opts){
  opts = opts||{};
  try{
    const f = await entry.handle.getFile();
    const txt = await f.text();
    const obj = JSON.parse(txt);
    const inc = obj.data || obj;
    if(!inc.helpers || !inc.employers) return {ok:false, msg:'Invalid backup structure'};
    const cmp = { cur:{h:DB.helpers.length,e:DB.employers.length,m:DB.matchings.length},
      inc:{h:(inc.helpers||[]).length, e:(inc.employers||[]).length, m:(inc.matchings||[]).length} };
    const apply = ()=>{
      pushUndo();
      DB = Object.assign(emptyDB(), inc);
      DB.meta = Object.assign({companyName:'Ka Shing Manpower agency'}, inc.meta||{});
      DB.meta.dirty = false;
      if(!DB.holidays || !Object.keys(DB.holidays).length) DB.holidays = builtinHolidays();
      saveDraft(); refreshAll(); autoBackup();
      toast('✓ 已從資料夾載入：'+entry.name,'ok',4000);
    };
    if(opts.silent){ apply(); return {ok:true}; }
    openConfirm('從資料夾載入備份 — '+entry.name,
      `<div class="text-sm space-y-1">
        <div class="flex justify-between"><span>${t('imp.cur')}</span><b>${cmp.cur.h} FDH / ${cmp.cur.e} EMP / ${cmp.cur.m} MT</b></div>
        <div class="flex justify-between"><span>${t('imp.incoming')}</span><b class="text-green-600">${cmp.inc.h} FDH / ${cmp.inc.e} EMP / ${cmp.inc.m} MT</b></div>
        <div class="mt-2 p-2 rounded bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 font-semibold">⚠ ${t('imp.restoreWarn')} ${t('imp.confirmRestore')}</div>
      </div>`, apply);
    return {ok:true};
  }catch(e){ return {ok:false, msg:e.message||String(e)}; }
}

/* ── 開機時自動檢查：資料夾內有沒有比本機更新的備份 ── */
async function fsAutoLoadOnStart(){
  if(!fsSupported()) return;
  const h = await fsRestoreHandle();
  if(!h) return;
  const granted = await fsEnsurePermission(h, 'read');
  if(!granted){ FS_STATE.ready = false; return; }   // 需要使用者再次授權 → 由 UI 提示
  FS_STATE.ready = true;
  const files = await fsListJson();
  if(!files.length) return;
  const latest = files[0];
  /* 與「最後一次同步時間」比較：只有資料夾版本較新先考慮載入
     （用獨立時間戳，唔靠 lastExportedAt——因為自動寫出唔會更新嗰個欄） */
  const localAt = fsSyncAt() || DB.meta.lastExportedAt || '';
  const fileAt = new Date(latest.mtime).toISOString();
  if(localAt && fileAt <= localAt) return;         // 本機已較新 → 不動
  /* 安全：若本機有未匯出的改動（dirty），改用「比對摘要＋二次確認」而非靜默取代 */
  const risky = !!DB.meta.dirty;
  const res = await fsRestoreFromFile(latest, {silent:!risky});
  if(res.ok){ fsSetSyncAt(fileAt); console.log('[FS AutoLoad]', risky?'prompted for':'silently loaded', latest.name); }
}

/* ── 自動寫出備份（debounce，避免連續改動寫爆資料夾） ── */
function fsScheduleWrite(){
  if(!FS_STATE.handle) return;
  if(localStorage.getItem(FS_AUTOSAVE)!=='1') return;
  if(FS_STATE.timer) clearTimeout(FS_STATE.timer);
  FS_STATE.timer = setTimeout(()=>fsWriteBackup(), 3000);
}
async function fsWriteBackup(){
  if(!FS_STATE.handle || FS_STATE.busy) return;
  FS_STATE.busy = true;
  try{
    const granted = await fsEnsurePermission(FS_STATE.handle, 'readwrite');
    if(!granted){ return; }
    const d = new Date();
    const stamp = `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
    const name = FS_PREFIX + stamp + '.json';
    const out = { schemaVersion: SCHEMA_VERSION, exportedAt: nowStamp(),
      counts:{ helpers:DB.helpers.length, employers:DB.employers.length, matchings:DB.matchings.length, notes:DB.notes.length },
      data: DB };
    const fh = await FS_STATE.handle.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    await w.write(JSON.stringify(out,null,2));
    await w.close();
    FS_STATE.lastWrite = name;
    fsSetSyncAt(new Date().toISOString());
    await fsCleanupOld();
    renderImport();
  }catch(e){
    /* 寫入失敗不影響正常使用（例：權限被收回、磁碟滿） */
    console.warn('[FS AutoSave] failed:', e && e.message);
  }finally{ FS_STATE.busy = false; }
}
/* ── 清理舊的自動備份（只刪自己寫的檔，保留最近 FS_MAX_FILES 份） ── */
async function fsCleanupOld(){
  const files = await fsListJson();
  const mine = files.filter(f=>f.name.startsWith(FS_PREFIX));
  if(mine.length <= FS_MAX_FILES) return;
  for(const f of mine.slice(FS_MAX_FILES)){
    try{ await FS_STATE.handle.removeEntry(f.name); }catch(e){}
  }
}
/* ── 取消同步（清除 handle 與設定） ── */
async function fsDisconnect(){
  if(FS_STATE.timer){ clearTimeout(FS_STATE.timer); FS_STATE.timer=null; }
  try{ await fsIdbDel('dir'); }catch(e){}
  try{ localStorage.removeItem(FS_DIR_KEY); }catch(e){}
  try{ localStorage.setItem(FS_AUTOSAVE,'0'); }catch(e){}
  FS_STATE.handle = null; FS_STATE.ready = false; FS_STATE.lastWrite = '';
  renderImport();
}
/* ── 手動：立即寫出一份 ── */
async function fsWriteNow(){
  if(!FS_STATE.handle){ toast('⚠ 未設定同步資料夾','error'); return; }
  await fsWriteBackup();
  if(FS_STATE.lastWrite) toast('✓ 已寫出：'+FS_STATE.lastWrite,'ok',4000);
}
/* ── 手動：立即讀回最新 ── */
async function fsLoadNow(){
  if(!FS_STATE.handle){ toast('⚠ 未設定同步資料夾','error'); return; }
  const files = await fsListJson();
  if(!files.length){ toast('資料夾內未有 .json 備份','info'); return; }
  await fsRestoreFromFile(files[0], {silent:false});
}
/* CSV 欄位定義（標題列接受中/英/印三語欄名） */
/* ▼ CSV_FIELDS_FDH / CSV_FIELDS_EMP → crm-data.js */
const IMP_STATE = { rows:null, headers:[], map:{}, kind:'fdh', strategy:'skip', errors:[], profile:null, sheets:null, sheetIdx:0 };

/* ═════════ CSV 匯出（依匯入欄位定義；FDH=菲傭+印傭全數 / EMP=僱主全數） ═════════ */
function csvCell(v){
  const s = String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(kind){
  const fields = kind==='fdh' ? CSV_FIELDS_FDH : CSV_FIELDS_EMP;
  const rows = kind==='fdh' ? DB.helpers : DB.employers;
  if(!rows.length){ toast('No data to export / 無資料可匯出','warn'); return; }
  const codeHdr = kind==='fdh' ? '編號/Code' : '僱主編號/Code';
  const lines = [[codeHdr, ...fields.map(f=>f.names.zhHant)].map(csvCell).join(',')];
  rows.forEach(r=>{
    const cells = [r.code||''].concat(fields.map(f=>{
      let v = r[f.k];
      if(Array.isArray(v)) v = v.join(';');
      else if(v && typeof v==='object') v = v.active ? (td(v.level)+' '+(v.reason||'')) : '';
      if(f.type==='date') v = fmtDate(v);
      return csvCell(v==null?'':v);
    }));
    lines.push(cells.join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kashing-${kind}-${todayStr()}.csv`;
  a.click();
  toast(t('imp.csvExport')+' ✓ ('+rows.length+')','ok');
}

/* CSV 解析（支援引號內逗號） */
function parseCSV(text){
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell); cell=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); if(row.some(x=>x!=='')) rows.push(row); }
  return rows;
}
/* 編碼偵測：UTF-8(BOM) → UTF-8 → Big5 → GBK（單一 ArrayBuffer 讀取路徑） */
function readCSVFile(file, cb){
  const r = new FileReader();
  r.onload = ()=>{
    let text = new TextDecoder('utf-8').decode(r.result).replace(/^\uFEFF/,''); // 去 BOM
    if(/\uFFFD/.test(text)){ // UTF-8 有亂碼 → 嘗試 Big5 → GBK
      try{ text = new TextDecoder('big5').decode(r.result); }catch(e){}
      if(/\uFFFD/.test(text)){ try{ text = new TextDecoder('gbk').decode(r.result); }catch(e){} }
      if(/\uFFFD/.test(text)) toast('Encoding error — please Save As UTF-8 CSV / 請另存為 UTF-8 CSV', 'error', 6000);
    }
    cb(text);
  };
  r.readAsArrayBuffer(file);
}

/* ═════════ 讀入表格（統一入口：CSV 或 XLSX） ═════════
   載入後自動：① 偵測來源格式（Profile）② 建立欄位對映 ③ 值轉換 ④ 驗證報告 */
function loadTable(headers, rows, opts){
  opts = opts||{};
  IMP_STATE.headers = headers.map(h=>String(h||'').trim());
  IMP_STATE.rows = rows;
  const fields = IMP_STATE.kind==='fdh'?CSV_FIELDS_FDH:CSV_FIELDS_EMP;
  /* ① 來源格式偵測；偵測到即自動切換匯入類別（菲傭/印傭 或 僱主） */
  IMP_STATE.profile = opts.profile!==undefined ? opts.profile : detectProfile(IMP_STATE.headers);
  const prof = IMP_STATE.profile ? IMPORT_PROFILES[IMP_STATE.profile] : null;
  if(prof && prof.kind!==IMP_STATE.kind) IMP_STATE.kind = prof.kind;
  /* ② 欄位對映：優先用 Profile 定義，其次用欄位名稱自動比對 */
  const savedMap = JSON.parse(localStorage.getItem(MAP_KEY)||'null');
  const saved = (savedMap && savedMap[IMP_STATE.profile||('kind:'+IMP_STATE.kind)])||null;
  if(opts.keepMap && saved){ IMP_STATE.map = saved; }
  else{
    const m={_kind:IMP_STATE.kind};
    if(prof){
      for(const k in prof.cols){ const i=findColIndex(IMP_STATE.headers, prof.cols[k]); if(i>=0) m[k]=i; }
    }else{
      fields.forEach(f=>{ const idx=IMP_STATE.headers.findIndex(h=>{
        return [f.names.zhHant,f.names.en,f.k].some(n=>h.toLowerCase()===String(n).toLowerCase()||h===n); });
        if(idx>=0) m[f.k]=idx; });
    }
    IMP_STATE.map = m;
  }
  validateCSV(); renderCsvMapping();
}
function loadCSV(text){
  const rows = parseCSV(text.replace(/^\uFEFF/,'')); // 去 BOM
  if(rows.length<2){ toast('CSV empty','error'); return; }
  loadTable(rows[0], rows.slice(1));
}
/* 讀取 .xlsx → 載入第一個（或使用者選定的）工作表 */
async function loadXLSX(file){
  try{
    const sheets = await xlReadFile(file);
    IMP_STATE.sheets = sheets;
    IMP_STATE.sheetIdx = 0;
    if(sheets.length>1) return renderSheetPicker();   // 多工作表 → 讓使用者選
    applySheet(0);
  }catch(e){
    console.error(e);
    toast('XLSX 讀取失敗：'+(e&&e.message||e),'error',8000);
  }
}
function applySheet(idx){
  const sh=IMP_STATE.sheets[idx]; if(!sh) return;
  IMP_STATE.sheetIdx=idx;
  const rows=sh.rows||[];
  if(rows.length<2){ toast('工作表「'+sh.name+'」沒有資料列','error'); return; }
  loadTable(rows[0], rows.slice(1));
}
function renderSheetPicker(){
  const area=document.getElementById('csvArea'); if(!area) return;
  area.innerHTML=`
    <div class="card p-3 mt-3">
      <div class="text-sm font-bold mb-2">此檔案含多個工作表，請選擇：</div>
      <div class="space-y-1">${IMP_STATE.sheets.map((s,i)=>`
        <button class="w-full text-left btn btn-sec !min-h-[38px] !py-1.5 text-sm" data-sheet="${i}">
          <i data-lucide="table" class="w-4 h-4"></i>${esc(s.name)} <span class="text-xs muted">（${(s.rows||[]).length} 列）</span>
        </button>`).join('')}</div>
    </div>`;
  refreshIcons();
  area.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>applySheet(+b.dataset.sheet));
}

function renderImport(){
  const el = document.getElementById('importBody');
  const savedMap = JSON.parse(localStorage.getItem(MAP_KEY)||'null');
  el.innerHTML = `
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="card p-4">
      <h3 class="font-bold mb-2 flex items-center gap-2"><i data-lucide="file-json" class="w-5 h-5 text-indigo-600"></i>${t('imp.jsonTitle')}</h3>
      <div class="space-y-2 text-sm">
        <button id="impExport" class="btn btn-pri w-full justify-center"><i data-lucide="download" class="w-4 h-4"></i>${t('imp.exportNow')}</button>
        <label class="btn btn-sec w-full justify-center cursor-pointer"><i data-lucide="upload" class="w-4 h-4"></i>${t('imp.restoreBtn')}
          <input type="file" id="impRestore" accept=".json" class="hidden"></label>
        <p class="text-xs muted">⚠ ${t('imp.restoreWarn')}</p>
        <div class="border-t bd pt-2 mt-2 text-xs muted flex items-center gap-2"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i>Undo (Ctrl+Z): <b>${undoStack.length}</b>/20
          <button id="impUndo" class="btn btn-sec !min-h-[28px] !py-0.5 !px-2 text-xs">Ctrl+Z</button></div>
      </div>
    </div>
    <div class="card p-4">
      <h3 class="font-bold mb-2 flex items-center gap-2"><i data-lucide="file-spreadsheet" class="w-5 h-5 text-green-600"></i>${t('imp.csvTitle')}</h3>
      <p class="text-xs text-green-700 font-semibold mb-2">✓ ${t('imp.xlsxSupport')}</p>
      <div class="flex gap-2 mb-3 text-sm">
        <label class="chip ${IMP_STATE.kind==='fdh'?'on':''}" data-kind="fdh">${t('tab.ph')}/${t('tab.id')}</label>
        <label class="chip ${IMP_STATE.kind==='emp'?'on':''}" data-kind="emp">${t('tab.emp')}</label>
      </div>
      <label class="btn btn-sec w-full justify-center cursor-pointer"><i data-lucide="file-up" class="w-4 h-4"></i>${t('imp.choose')}
        <input type="file" id="impCsv" accept=".csv,.xlsx,text/csv" class="hidden"></label>
      <button id="btnExpCsv" class="btn btn-pri w-full justify-center mt-2"><i data-lucide="file-down" class="w-4 h-4"></i>${t('imp.csvExport')} — ${IMP_STATE.kind==='fdh'?'FDH 外傭':'Employers 僱主'}</button>

}

function loadCSV(text){
  const rows = parseCSV(text.replace(/^\uFEFF/,'')); // 去 BOM
  if(rows.length<2){ toast('CSV empty','error'); return; }
  IMP_STATE.headers = rows[0].map(h=>h.trim());
  IMP_STATE.rows = rows.slice(1);
  /* 自動對映：三語欄名比對 + 記住上次對映 */
  const fields = IMP_STATE.kind==='fdh'?CSV_FIELDS_FDH:CSV_FIELDS_EMP;
  if(!Object.keys(IMP_STATE.map).length || !IMP_STATE.map._kind || IMP_STATE.map._kind!==IMP_STATE.kind){
    const m = {_kind:IMP_STATE.kind};
    fields.forEach(f=>{ const idx = IMP_STATE.headers.findIndex(h=>{
      return [f.names.zhHant,f.names.en,f.k].some(n=>h.toLowerCase()===String(n).toLowerCase()||h===n); });
      if(idx>=0) m[f.k]=idx; });
    IMP_STATE.map = m;
  }
  saveCsvMap(); validateCSV(); renderCsvMapping();
}
function saveCsvMap(){ const all = JSON.parse(localStorage.getItem(MAP_KEY)||'{}'); all[IMP_STATE.profile||('kind:'+IMP_STATE.kind)]=IMP_STATE.map; localStorage.setItem(MAP_KEY, JSON.stringify(all)); }

/* 工人身份識別鍵：優先 extCode（工人編號）；空白時以「姓名＋生日＋電話」自動識別
   （helper db 有 7 筆工人編號空白，其中部分與其他列是同一人，故需此後備鍵避免重複） */
/* 工人身份比對用電話鍵：取已分流欄位之末 9 位（來源與入庫一致，故穩定可比對）
   亦包含通用 phone 欄（部分來源檔直接對映到 phone，未經國碼分流） */
function helperPhoneKey(h){
  const all=[h.phoneHK,h.phoneIndo,h.phonePH,h.phone].map(v=>String(v||'').replace(/\D/g,'')).filter(Boolean);
  const joined=all.join('');
  return joined.length>9?joined.slice(-9):joined;
}
/* 工人身份識別鍵（分層）：
   ① E:工人編號（最準確，有就一定用）
   ② C:姓名|生日|電話（三者齊全，最可靠）
   ③ N:姓名|電話（生日缺失時的後備鍵；只喺對方生日相同或對方冇生日時先算同一人）
   ④ 姓名|生日（電話缺失時的後備鍵）
   設計原則：寧願保守（可能當兩個人）都好過錯誤合併兩個不同工人 */
function helperMatchKeys(rec){
  const keys=[];
  const ec=String(rec.extCode||'').trim();
  if(ec) keys.push('E:'+ec);
  /* 生日用正規化後的值（入庫時 'NA' 會變成空白，唔正規化就對唔上） */
  const nm=String(rec.engName||'').trim().toUpperCase();
  const bt=normalizeDate(rec.birth);
  const ph=helperPhoneKey(rec);
  if(nm&&bt&&ph) keys.push('C:'+nm+'|'+bt+'|'+ph);
  if(nm&&ph) keys.push('N:'+nm+'|'+ph);
  if(nm&&bt) keys.push('B:'+nm+'|'+bt);
  return keys;
}
function findHelperMatch(rec){
  const keys=helperMatchKeys(rec);
  if(!keys.length) return -1;
  const recBt=normalizeDate(rec.birth);
  for(const k of keys){
    const kind=k.charAt(0);
    const i=DB.helpers.findIndex(h=>{
      const he=String(h.extCode||'').trim();
      if(kind==='E') return he===k.slice(2);
      const hn=String(h.engName||'').trim().toUpperCase();
      const hb=normalizeDate(h.birth);
      const hp=helperPhoneKey(h);
      if(kind==='C') return hn+'|'+hb+'|'+hp===k.slice(2);
      if(kind==='N'){
        /* 姓名＋電話相同：若兩邊都有生日而唔同，就當作兩個人（唔合併） */
        if(hn+'|'+hp!==k.slice(2)) return false;
        if(recBt&&hb&&recBt!==hb) return false;
        return true;
      }
      if(kind==='B'){
        /* 姓名＋生日相同：若兩邊都有電話而唔同，就當作兩個人（唔合併） */
        if(hn+'|'+hb!==k.slice(2)) return false;
        const recPh=helperPhoneKey(rec);
        if(recPh&&hp&&recPh!==hp) return false;
        return true;
      }
      return false;
    });
    if(i>=0) return i;
  }
  return -1;
}

/* 依欄位對映 + Profile 規則，把一行原始資料轉成 CRM 記錄（值轉換在此統一處理） */
function buildRecord(kind, row){
  const fields = kind==='fdh'?CSV_FIELDS_FDH:CSV_FIELDS_EMP;
  const rec={};
  fields.forEach(f=>{ if(IMP_STATE.map[f.k]!=null) rec[f.k]=(row[IMP_STATE.map[f.k]]||'').trim(); });
  const prof = IMP_STATE.profile ? IMPORT_PROFILES[IMP_STATE.profile] : null;
  if(prof){
    /* 多欄合計（星馬＝新加坡＋馬來西亞；中東＝中東＋沙特；其他＝印尼＋菲律賓） */
    for(const k in (prof.sum||{})){
      let s=0, any=false;
      prof.sum[k].forEach(spec=>{ const i=findColIndex(IMP_STATE.headers,spec); if(i<0) return;
        const y=parseYearsText(row[i]); if(y) any=true; s+=y; });
      rec[k]= any? String(Math.round(s*100)/100) : '';
    }
    /* 推算欄位（如總年資：原欄優先，缺失時以各地經驗加總） */
    for(const k in (prof.derive||{})){
      const d=prof.derive[k];
      const i=findColIndex(IMP_STATE.headers, d.src);
      let v = i>=0 ? String(row[i]||'').trim() : '';
      if(!v && d.fallbackSum){
        let s=0, any=false;
        d.fallbackSum.forEach(sp=>{ const j=findColIndex(IMP_STATE.headers,sp); if(j<0) return;
          const y=parseYearsText(row[j]); if(y) any=true; s+=y; });
        if(any) v=String(Math.round(s*100)/100);
      }
      /* 備用出生年（BIRTHDAY 空時用 Year of Birth 補成 YYYY-01-01） */
      if(!v && d.fallbackYear){
        const j=findColIndex(IMP_STATE.headers, d.fallbackYear);
        const yv = j>=0 ? String(row[j]||'').trim() : '';
        if(/^\d{4}$/.test(yv)) v = yv+'-01-01';
      }
      rec[k]=v;
    }
    /* 總年資：原欄優先，缺失時以備用欄推算（例 INDO HELPER 的 Total Exp → HK exp） */
    if(prof.deriveExpYears){
      const d=prof.deriveExpYears;
      const i=findColIndex(IMP_STATE.headers, d.src);
      let v = i>=0 ? String(row[i]||'').trim() : '';
      if(v) rec.expYears = String(parseYearsText(v) || 0);
      else if(d.fallback){
        const j=findColIndex(IMP_STATE.headers, d.fallback);
        if(j>=0){ const y=parseYearsText(row[j]); if(y) rec.expYears=String(y); }
      }
    }
    /* 經驗欄位：來源是文字（"6MONTHS"/"12YEARS"）時先解析成數字
       expCols 列出的是「CRM 欄位名」（如 expHK），來源欄由 prof.cols 反查 */
    if(prof.expCols){
      prof.expCols.forEach(crmKey=>{
        const src=prof.cols[crmKey]; if(!src) return;
        const i=findColIndex(IMP_STATE.headers, src);
        if(i<0) return;
        const raw=String(row[i]||'').trim();
        if(!raw) return;
        const y=parseYearsText(raw);
        if(y!=null) rec[crmKey]=String(y);
      });
    }
    /* 地區經驗：從「Total Exp」文字（如 "2 S.G.P/3T.W"）拆出各地年資 */
    if(prof.regionExp && prof.cols && prof.cols.expYears){
      const i=findColIndex(IMP_STATE.headers, prof.cols.expYears);
      const txt = i>=0 ? String(row[i]||'').trim() : '';
      if(txt){
        /* 逐個「數字 + 地區縮寫」配對 → 累加到對應 CRM 經驗欄 */
        const re=/(\d+(?:\.\d+)?)\s*([A-Z][A-Z.\s]*?)(?=\/|$|\s+\d)/g; let m;
        while((m=re.exec(txt))!==null){
          const num=parseFloat(m[1]); if(!isFinite(num)) continue;
          const key=m[2].trim().toUpperCase();
          for(const alias in prof.regionExp){
            const k2=alias.toUpperCase();
            if(key===k2 || key.replace(/\./g,'').startsWith(k2.replace(/\./g,''))){
              const field=prof.regionExp[alias];
              rec[field]=String(Math.round(((parseFloat(rec[field])||0)+num)*100)/100);
              break;
            }
          }
        }
      }
    }
    /* 語言：來源值（CANTONESE/MANDARIN/ENGLISH）→ 對應語言欄位 */
    if(prof.langMap && prof.langCol){
      const i=findColIndex(IMP_STATE.headers, prof.langCol);
      const raw = i>=0 ? String(row[i]||'').trim().toUpperCase() : '';
      if(raw){
        /* 值可能含多個語言（以 / 分隔） */
        raw.split(/[\/]/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
          for(const k in prof.langMap){
            if(tok===k.toUpperCase()){ rec[prof.langMap[k]]='GOOD'; break; }
          }
        });
      }
    }
    /* 技能標籤：來源縮寫（KID/OLD/NB/PETS）→ CRM SKILLS 碼 */
    if(prof.skillMap && prof.skillCol){
      const i=findColIndex(IMP_STATE.headers, prof.skillCol);
      const raw = i>=0 ? String(row[i]||'').trim().toUpperCase() : '';
      if(raw){
        const set=new Set();
        raw.split(/[\/,\s]+/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
          if(prof.skillMap[tok]) set.add(prof.skillMap[tok]);
        });
        if(set.size) rec.skills = Array.from(set);
      }
    }
    /* 「NIL」等佔位值 → 空白（例 Old Reference Code、電話欄）
       對 prof.cols 內的每個 CRM 欄位檢查（欄位值來自來源欄） */
    if(prof.nilValues){
      const nv=prof.nilValues.map(x=>String(x).toUpperCase());
      for(const k in prof.cols){
        if(rec[k]===undefined) continue;
        if(nv.indexOf(String(rec[k]).trim().toUpperCase())>=0) rec[k]='';
      }
    }
    /* 來源 Sales 名稱 → 系統帳戶名 */
    if(prof.salesAliases && rec.sales){
      const key=String(rec.sales).trim().toUpperCase();
      if(prof.salesAliases[key]) rec.sales = prof.salesAliases[key];
    }
    /* 電話：去掉空格／括號等分隔符（例 "9042 3574" → "90423574"） */
    if(prof.phoneClean && rec.phone){
      rec.phone = String(rec.phone).replace(/[\s\-()]/g,'').trim();
    }
    /* 電話欄：按國碼分流到 phoneHK / phoneIndo / phonePH（其他國碼 → 原始備註） */
    if(prof.phoneCol){
      const i=findColIndex(IMP_STATE.headers,prof.phoneCol);
      if(i>=0){
        const raw=String(row[i]||'').trim();
        if(raw){
          const pr=classifyPhoneRaw(raw, valLookup(rec.nationality,VAL_NAT));
          if(pr.cc==='HK') rec.phoneHK=pr.num;
          else if(pr.cc==='ID') rec.phoneIndo=pr.num;
          else if(pr.cc==='PH') rec.phonePH=pr.num;
          else rec.__otherPhone=raw;
        }
      }
    }
    /* 未對映欄位 → 原始備註（保留全部原始資料，不丟失） */
    const parts=[];
    (prof.extra||[]).forEach(spec=>{
      const i=findColIndex(IMP_STATE.headers,spec); if(i<0) return;
      const v=String(row[i]||'').trim(); if(!v) return;
      const label=(prof.labels&&prof.labels[spec])||spec;
      parts.push(label+'：'+v);
    });
    if(rec.__otherPhone) parts.push('電話(其他)：'+rec.__otherPhone);
    if(parts.length) rec.rawNotes = parts.join(' ｜ ');
    /* 旗標欄位（例：取消申請日期有值 → 僱主階段 TERMINATED）
       flags：來源欄名 → {field:目標欄位, value:值} */
    for(const spec in (prof.flags||{})){
      const i=findColIndex(IMP_STATE.headers,spec); if(i<0) continue;
      const fl=prof.flags[spec];
      if(String(row[i]||'').trim()) rec[fl.field] = fl.value;
    }
  }
  delete rec.__otherPhone;
  return rec;
}

/* 驗證報告：必填、HKID/護照 6–7 位數字、編號重複、日期格式、Profile 必要欄位 */
function validateCSV(){
  const fields = IMP_STATE.kind==='fdh'?CSV_FIELDS_FDH:CSV_FIELDS_EMP;
  const prof = IMP_STATE.profile ? IMPORT_PROFILES[IMP_STATE.profile] : null;
  const errs=[]; const seen={};
  IMP_STATE.rows.forEach((r,i)=>{
    const rec = buildRecord(IMP_STATE.kind, r);
    if(!Object.values(rec).some(v=>v)) return; // 空行略過
    if(fields===CSV_FIELDS_FDH){
      if(rec.hkid && !isValidIdNum(rec.hkid)) errs.push({row:i+2, msg:'HKID: '+t('form.badId'), type:'id'});
      if(rec.passport && !isValidPassport(rec.passport)) errs.push({row:i+2, msg:'Passport: '+t('form.badId'), type:'id'});
      const code = rec.hkid||rec.passport;
      if(code){ if(seen[code]) errs.push({row:i+2, msg:t('form.dupId')+': '+code, type:'dup'}); seen[code]=1;
        if(DB.helpers.some(h=>h.code===code)) errs.push({row:i+2, msg:t('form.dupId')+' (DB): '+code, type:'dup'}); }
      /* Profile 模式：以 extCode（工人編號）去重；空白時用姓名＋生日＋電話後備鍵
         注意：空白工人編號不算硬錯誤（可正常匯入並自動識別），僅提示 */
      if(prof && prof.cols.extCode){
        const ec=rec.extCode;
        if(ec){ if(seen['E'+ec]) errs.push({row:i+2, msg:t('form.dupId')+' (extCode): '+ec, type:'dup'}); seen['E'+ec]=1; }
        const nm=String(rec.engName||'').trim().toUpperCase(), bt=normalizeDate(rec.birth);
        const ph=helperPhoneKey(rec);
        const ck='C:'+nm+'|'+bt+'|'+ph;
        if(nm&&bt&&ph){ if(seen[ck]) errs.push({row:i+2, msg:'同名同生日同電話: '+nm, type:'dup'}); seen[ck]=1; }
        /* 同名同電話但生日不同 → 疑似同一人（兩個編號），提示但不自動合併 */
        if(nm&&ph){
          const nk='N:'+nm+'|'+ph;
          if(seen[nk]&&seen[nk]!==bt) errs.push({row:i+2, msg:'疑似同一人（同名同電話、生日不同）: '+nm, type:'soft'});
          seen[nk]=bt;
        }
        if(!ec) errs.push({row:i+2, msg:t('fdh.extCode')+' 空白 → 以姓名/生日/電話識別', type:'soft'});
      }
      /* 冪等性檢查（Profile 無 extCode 時）：同名＋生日＋電話相同 → 重複匯入會覆蓋而非新增 */
      if(prof && !prof.cols.extCode){
        const nm=String(rec.engName||'').trim().toUpperCase(), bt=normalizeDate(rec.birth), ph=helperPhoneKey(rec);
        if(nm&&bt&&ph){
          const ck='C:'+nm+'|'+bt+'|'+ph;
          if(seen[ck]) errs.push({row:i+2, msg:'同名同生日同電話: '+nm, type:'dup'}); seen[ck]=1;
        }
        /* 缺少生日或電話 → 用姓名＋另一欄做後備去重鍵 */
        if(nm&&ph&&!bt){ const nk='N:'+nm+'|'+ph; if(seen[nk]) errs.push({row:i+2, msg:'同名同電話: '+nm, type:'dup'}); seen[nk]=1; }
        if(nm&&bt&&!ph){ const bk='B:'+nm+'|'+bt; if(seen[bk]) errs.push({row:i+2, msg:'同名同生日: '+nm, type:'dup'}); seen[bk]=1; }
      }
    } else {
      if(!rec.salutation) errs.push({row:i+2, msg:t('emp.salutation')+' '+t('form.required')+'（此列會被略過）', type:'soft'});
      /* Ref Code 重複偵測（檔內 + 資料庫），防止重複匯入 */
      if(rec.refCode){ if(seen['R'+rec.refCode]) errs.push({row:i+2, msg:'RefCode dup: '+rec.refCode, type:'dup'}); seen['R'+rec.refCode]=1;
        if(DB.employers.some(e=>e.refCode===rec.refCode)) errs.push({row:i+2, msg:'RefCode dup (DB): '+rec.refCode, type:'dup'}); }
    }
    /* 日期欄：能被 normalizeDate 轉成 ISO 就沒問題；轉不了只作提示（軟錯誤），唔阻擋匯入
       （來源 Excel 常見 'NA' / 手寫格式，唔應該令整批匯入失敗） */
    fields.forEach(f=>{ if(f.type==='date' && rec[f.k]){
      const nd = normalizeDate(rec[f.k]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)) errs.push({row:i+2, msg:f.k+' bad date: '+rec[f.k], type:'soft'});
    } });
  });
  IMP_STATE.errors = errs;
  const hard = errs.filter(e=>e.type!=='dup'&&e.type!=='soft');
  const soft = errs.filter(e=>e.type==='soft');
  const dup  = errs.filter(e=>e.type==='dup');
  const box = document.getElementById('csvReport');
  if(box){
    let html='';
    if(hard.length) html+=`<div class="rounded bg-red-100 dark:bg-red-900/40 p-2 text-xs text-red-700 dark:text-red-300 max-h-32 overflow-y-auto mb-1">
      <b>${t('imp.report')} — ${hard.length} errors</b>${hard.slice(0,20).map(e=>`<div>• Row ${e.row}: ${esc(e.msg)}</div>`).join('')}</div>`;
    if(soft.length) html+=`<div class="rounded bg-amber-100 dark:bg-amber-900/40 p-2 text-xs text-amber-800 dark:text-amber-200 max-h-24 overflow-y-auto mb-1">
      <b>${soft.length} warnings（可匯入）</b>${soft.slice(0,10).map(e=>`<div>• Row ${e.row}: ${esc(e.msg)}</div>`).join('')}</div>`;
    if(dup.length) html+=`<div class="rounded bg-amber-100 dark:bg-amber-900/40 p-2 text-xs text-amber-800 dark:text-amber-200 max-h-24 overflow-y-auto mb-1">
      <b>${dup.length} duplicates（依「重複編號策略」處理）</b>${dup.slice(0,10).map(e=>`<div>• Row ${e.row}: ${esc(e.msg)}</div>`).join('')}</div>`;
    if(!hard.length&&!soft.length&&!dup.length) html+=`<div class="rounded bg-green-100 dark:bg-green-900/40 p-2 text-xs text-green-700 dark:text-green-300">✓ ${t('imp.report')}: OK</div>`;
    box.innerHTML=html;
  }
}
/* 匯入：支援 upsert（以 extCode / refCode 為鍵更新既有記錄，避免重複匯入產生重複資料） */
function doImport(){
  /* 硬錯誤（缺編號/格式錯/缺必填/日期錯）阻止匯入；重複編號與提示交由策略處理 */
  const hardErrs = IMP_STATE.errors.filter(e=>e.type!=='dup'&&e.type!=='soft');
  if(hardErrs.length){ toast(`⚠ ${hardErrs.length} errors — fix file first / 請先修正錯誤`,'error',5000); return; }
  const fields = IMP_STATE.kind==='fdh'?CSV_FIELDS_FDH:CSV_FIELDS_EMP;
  const prof = IMP_STATE.profile ? IMPORT_PROFILES[IMP_STATE.profile] : null;
  pushUndo();
  let ok=0, skip=0, fail=0, upd=0;
  IMP_STATE.rows.forEach((r,i)=>{
    const rec = buildRecord(IMP_STATE.kind, r);
    if(!Object.values(rec).some(v=>v)) return;
    try{
      if(IMP_STATE.kind==='fdh'){
        const norm = normalizeFdh(rec);
        /* 唯一鍵：優先 Profile 內的 extCode；否則用後備鍵（姓名＋生日＋電話）→ 令重複匯入唔會產生重複資料 */
        let existing=-1;
        if(prof) existing = findHelperMatch(rec);
        else{
          const code = rec.hkid||rec.passport;
          if(code) existing = DB.helpers.findIndex(h=>h.code===code);
          else existing = findHelperMatch(rec);
        }
        if(existing>=0){
          const old = DB.helpers[existing];
          /* 同一人多筆紀錄 → 原始備註累加（確保任何一筆的來源資料都不遺失） */
          const mergedNotes = (old.rawNotes && norm.rawNotes && old.rawNotes!==norm.rawNotes)
            ? old.rawNotes+' ｜ '+norm.rawNotes : (norm.rawNotes||old.rawNotes||'');
          if(IMP_STATE.strategy==='skip'){
            /* 跳過：CRM 欄位不覆蓋，但原始備註仍累加（避免來源資料遺失） */
            DB.helpers[existing] = { ...old, rawNotes: mergedNotes };
            skip++; return;
          }
          /* 覆蓋：保留既有 CRM 編號與人手設定的工人類別，只更新匯入欄位 */
          DB.helpers[existing] = { ...old, ...norm, code: old.code,
            workerClass: old.workerClass||'GOOD', classReason: old.classReason||'', classAt: old.classAt||'',
            extCode: rec.extCode||old.extCode||'', rawNotes: mergedNotes };
          upd++; ok++; return;
        }
        const code = rec.hkid||rec.passport|| nextProvCode();
        DB.helpers.push({ ...emptyFdh(rec.nationality), ...norm, code, extCode: rec.extCode||'',
          ownerEmail: (typeof newOwnerEmail==='function') ? newOwnerEmail() : '' });
        ok++;
      } else {
        const norm = normalizeEmp(rec);
        if(!norm.salutation){ fail++; return; }
        /* Ref Code 重複：依策略跳過或覆蓋（保留原 EM 編號） */
        const existing = rec.refCode ? DB.employers.findIndex(e=>e.refCode===rec.refCode) : -1;
        if(existing>=0){
          if(IMP_STATE.strategy==='skip'){ skip++; return; }
          const old = DB.employers[existing];
          DB.employers[existing] = { ...old, ...norm, code: old.code,
            stage: (rec.stage!==undefined && rec.stage!=='') ? norm.stage : old.stage,
            level: (rec.level!==undefined && rec.level!=='') ? norm.level : old.level,
            needs: (rec.needs!==undefined) ? norm.needs : (old.needs||[]),
            acceptedNat: (rec.acceptedNat!==undefined) ? (norm.acceptedNat.length?norm.acceptedNat:(old.acceptedNat||[])) : (old.acceptedNat||[]),
            lastContact: old.lastContact||'' };
          upd++; ok++; return;
        }
        DB.employers.push({ ...emptyEmp(), ...norm,
          ownerEmail: (typeof newOwnerEmail==='function') ? newOwnerEmail() : '' });
        ok++;
      }
    }catch(e){ console.error(e); fail++; }
  });
  markChange(); autoBackup();
  openModal(t('imp.csvTitle'), `<p class="text-sm font-bold">${t('imp.done',{ok,skip,fail})}</p>
    <p class="text-xs muted mt-1">${t('imp.updCount',{upd})}</p>`);
  renderImport();
}
/* 日期正規化：支援 YYYY-MM-DD / YYYY/MM/DD / MM/DD/YYYY / DD-MM-YYYY / YYYY（只用年）/ Excel 序號
   無效值（NA / N/A / - / 空）→ 空白 */
function normalizeDate(v){
  if(v===undefined||v===null) return '';
  v=String(v).trim();
  if(!v) return '';
  const up=v.toUpperCase();
  if(up==='NA'||up==='N/A'||up==='NIL'||up==='-'||up==='--'||up==='TBD'||up==='?') return '';
  /* 常見手寫/掃描錯字：O→0, l/I→1, S→5（只限日期格式字串） */
  const v2 = /^\d{1,4}[-\/]/.test(v) ? v.replace(/O/g,'0').replace(/[lI]/g,'1').replace(/S/g,'5') : v;
  /* 已正規化 */
  let m=/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(v2);
  if(m) return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
  /* MM/DD/YYYY 或 DD/MM/YYYY */
  m=/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/.exec(v2);
  if(m){
    const a=+m[1], b=+m[2];
    /* 第一段 > 12 → 一定是日（DD/MM/YYYY）；否則按 MM/DD 處理 */
    if(a>12 && b<=12) return `${m[3]}-${pad2(b)}-${pad2(a)}`;
    if(b>12 && a<=12) return `${m[3]}-${pad2(a)}-${pad2(b)}`;
    return `${m[3]}-${pad2(a)}-${pad2(b)}`;
  }
  /* 只有年 */
  m=/^(\d{4})$/.exec(v2);
  if(m) return m[1]+'-01-01';
  /* Excel 日期序號（1900 系統，> 20000 ≈ 1954 年後） */
  if(/^\d{5}(\.\d+)?$/.test(v2)){
    const n=parseFloat(v2);
    if(n>20000 && n<60000){
      const d=new Date(Math.round((n-25569)*86400000));
      if(!isNaN(d.getTime())) return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
    }
  }
  return v;
}
function normalizeFdh(r){
  const cv = valLookup(r.contract,VAL_CONTRACT);

  /* 語言值：好/中等/學習中/沒有評價 → GOOD/FAIR/NONE */
  const lang = (v,def)=>{ const x=valLookup(v,VAL_LANG); return ['NATIVE','GOOD','FAIR','NONE'].includes(x)?x:def; };
  const mar = valLookup(r.marital,VAL_MARITAL);
  const edu = valLookup(r.education,VAL_EDU);
  return { engName:r.engName||'', extCode:r.extCode||'', refNo:r.refNo||'', nickname:r.nickname||'',
  nationality: valLookup(r.nationality,VAL_NAT)||'PH',

  education: (['ELEMENTARY','HIGH_SCHOOL','COLLEGE','UNIVERSITY','VOCATIONAL','OTHER'].includes(edu)?edu:'HIGH_SCHOOL'),
  langEn:lang(r.langEn,'GOOD'), langCt:lang(r.langCt,'NONE'),
  langPtn:lang(r.langPtn,'NONE'),
  phoneHK:r.phoneHK||'', phoneIndo:r.phoneIndo||r.phone||'', phonePH:r.phonePH||'',
  email:r.email||'', facebook:r.facebook||'', bestInterest:r.bestInterest||'', expSummary:r.expSummary||'',

  skills: Array.isArray(r.skills) ? r.skills.filter(s=>SKILLS.includes(s))
        : (r.skills? String(r.skills).split(/[;，,、\/]/).map(s=>s.trim()).filter(s=>SKILLS.includes(s)) : []),
  expYears: (r.expYears!==''&&r.expYears!=null) ? parseYearsText(r.expYears) : 0,
  contract:CONTRACTS.includes(cm)?cm:'FIND_JOB',
  workerClass:WCLASS.includes(r.workerClass)?r.workerClass:'GOOD', classReason:r.classReason||'',
  warning:{active:false},
  hkid:r.hkid||'', passport:r.passport||'', contractExpiry:normalizeDate(r.contractExpiry),
  rawNotes:r.rawNotes||'', notes:r.notes||'' }; }
function emptyFdh(nat){ return { refNo:'', extCode:'', skills:[], warning:{active:false} }; }
function normalizeEmp(r){ const arr=v=>Array.isArray(v)?v:(v?String(v).split(/[;，,、\/]/).map(x=>x.trim()).filter(Boolean):[]);
  return { code:genEmpCode(), refCode:r.refCode||'', refCodeOld:r.refCodeOld||'', erNameZh:r.erNameZh||'', sales:stdSales(r.sales),
  salutation:r.salutation||'', nickname:r.nickname||'', phone:r.phone||'', whatsapp:r.whatsapp||'',
  family:r.family||'', needs:arr(r.needs).filter(x=>SKILLS.includes(x)),
  acceptedNat:(()=>{ const a=arr(r.acceptedNat).filter(x=>['PH','ID','OTHER'].includes(x)); return a.length?a:['PH','ID']; })(),
  expectDate:normalizeDate(r.expectDate),
  source:r.source||'', level:r.level||'NEW', stage:r.stage||'FINDING', lastContact:'', followUp:r.followUp||'',
  title:r.title||'', district:r.district||'', email:r.email||'', expectedStartDate:normalizeDate(r.expectedStartDate),
  maidRoom:r.maidRoom||'', offDay:r.offDay||'', flatSize:toNum(r.flatSize), bedrooms:toNum(r.bedrooms),
  fmAdultCount:toNum(r.fmAdultCount), fmAdultNote:r.fmAdultNote||'', fmInfantCount:toNum(r.fmInfantCount), fmInfantNote:r.fmInfantNote||'',
  fmChildrenCount:toNum(r.fmChildrenCount), fmChildrenNote:r.fmChildrenNote||'', fmElderlyCount:toNum(r.fmElderlyCount), fmElderlyNote:r.fmElderlyNote||'',
  fmDisabledCount:toNum(r.fmDisabledCount), fmDisabledNote:r.fmDisabledNote||'',
  homeMembers:arr(r.homeMembers), jobDuties:arr(r.jobDuties), maritalPref:arr(r.maritalPref), appTypes:arr(r.appTypes),
  rawNotes:r.rawNotes||'', notes:r.notes||'' }; }

function copyText(txt, okMsg){
  const done = ()=>toast(okMsg||'Copied ✓','ok');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta = document.createElement('textarea'); ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed','error'); }
  ta.remove();
}

<script>
/* ═════════ 標準回覆知識庫 ═════════
   來源：培訓手冊 Q1–Q21 + 客戶服務應對手冊 Q1–Q14 + QA 勞工法例題庫（重複項已合併：申請文件/流程時間表）
   cat: flow=跟進流程 / faq=公司・服務 / law=勞工法例；stage 對應 STAGES（law/faq 為空 = 不分階段） */
/* ▼ KB 標準回覆知識庫 → crm-data.js */
/* KB 送出時簡單合併欄位（僱主稱呼／中介公司名／今日日期） */
function kbFill(text, emp){
  return text
    .replace(/\{僱主稱呼\}/g, (emp&&emp.salutation)||'{僱主稱呼}')
    .replace(/\{中介公司名\}/g, DB.meta.companyName||'{中介公司名}')
    .replace(/\{今日日期\}/g, todayStr());
}
function kbText(e){ return (e.a&&e.a.zh)||''; }

/* ═════════ 知識庫範本庫（雙語：中文版 + 英文版；各用獨立 localStorage key，可隨時修改／增刪） ═════════
   zh → 'wb_kb_templates_v1'（沿用原有 key，中文版）
   en → 'wb_kb_templates_en_v1'（英文版，預設空白起步，可自由編輯） */
const KB_TPL_KEY = 'wb_kb_templates_v1';
const KB_TPL_KEY_EN = 'wb_kb_templates_en_v1';
const KB_TPL_KEY_INDO = 'wb_kb_templates_indo_v1';
const KB_TPL_KEY_TAG = 'wb_kb_templates_tag_v1';
const SENDLOG_KEY = 'wb_sendlog_pending_v1';
/* 四語言範本各自獨立存於 localStorage：zh 自動種子化內建中文範本；en/indo/tag 空白起步，由用戶自行建立 */
function kbTplKey(lang){
  if(lang==='en') return KB_TPL_KEY_EN;
  if(lang==='indo') return KB_TPL_KEY_INDO;
  if(lang==='tag') return KB_TPL_KEY_TAG;
  return KB_TPL_KEY;
}
function kbTplSeed(lang){
  const arr = [];
  KB.forEach(e=>{
    if(lang==='en'){ if(e.q && e.q.en) arr.push({id:'K'+e.id, title:e.q.en, body:(e.a&&e.a.en)||''}); }
    else arr.push({id:'K'+e.id, title:e.q.zh, body:kbText(e)});
  });
  return arr;
}
function kbTplAll(lang){
  const key = kbTplKey(lang);
  let arr = null;
  try{ const raw = localStorage.getItem(key); if(raw) arr = JSON.parse(raw); }catch(err){}
  if(!Array.isArray(arr)) arr = [];
  /* 只有中文版會在完全空白時自動種子化；其他語言維持空白起步（用戶自行建立） */
  if(!arr.length && lang==='zh'){ arr = kbTplSeed(lang); try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(err){} }
  return arr;
}
function kbTplSave(lang, arr){ lsSet(kbTplKey(lang), JSON.stringify(arr)); }
function kbTplUpd(lang, id, patch){ const arr=kbTplAll(lang); const t=arr.find(x=>x.id===id); if(t){ Object.assign(t,patch); kbTplSave(lang,arr); } }
function kbTplAdd(lang, title, body){ const arr=kbTplAll(lang); arr.push({id:'U'+Date.now(), title, body}); kbTplSave(lang,arr); }
function kbTplDel(lang, id){ kbTplSave(lang, kbTplAll(lang).filter(x=>x.id!==id)); }
/* 還原內建預設範本：只有中文版有內建範本（50 條）；
   ENG / INDO / Tagalog 按設計無內建內容（保持空白，用戶自行建立），故還原＝維持現狀，不注入英文內容 */
function kbTplRestore(lang){
  if(lang !== 'zh') return (kbTplAll(lang)).length;
  const seed = kbTplSeed('zh');
  const cur = kbTplAll('zh');
  const byId = {}; cur.forEach(x=>byId[x.id]=x);
  seed.forEach(s=>{ const c=byId[s.id]; if(c){ if(!c.title) c.title=s.title; if(!c.body) c.body=s.body; } else cur.push(s); });
  kbTplSave('zh', cur);
  return cur.length;
}
/* WhatsApp 分頁發送紀錄 → 主頁 focus 時合併入 DB.sendLog（並更新僱主最後對話） */
function mergePendingSends(){
  let pend = [];
  try{ pend = JSON.parse(localStorage.getItem(SENDLOG_KEY)||'[]'); }catch(err){}
  if(!Array.isArray(pend) || !pend.length) return;
  pend.forEach(s=>{

}

/* ═════════ PRD 流程3 + 流程4：推薦追蹤 + WhatsApp 一鍵帶入 ═════════ */

/* 外傭摘要（帶入 WA 範本用） */
function helperSummary(h){
  if(!h) return '';
  const bits = [];
  if(h.education) bits.push(td(h.education));
  const age = calcAge(h.birth); if(age) bits.push(age+' '+t('fdh.age'));
  if(h.expYears) bits.push(h.expYears+' '+t('fdh.expYears'));
  if(h.langEn) bits.push('EN:'+td(h.langEn));
  if(h.bestInterest) bits.push(td(h.bestInterest));
  if((h.skills||[]).length) bits.push((h.skills||[]).map(td).join('/'));
  return bits.join(' · ');
}
/* 某僱主已推薦過嘅外傭清單 */
function recList(empCode){
  return (DB.recommendations||[]).filter(function(r){ return r.empCode === empCode; });
}
/* 寫入推薦紀錄（防重複） */
function recordRecommendation(empCode, fdhCode, fdhName){
  if(!empCode || !fdhCode) return null;
  const dup = recList(empCode).filter(function(r){ return r.fdhCode === fdhCode; })[0];
  if(dup) return dup;
  const rec = { id:uid(), empCode:empCode, fdhCode:fdhCode, fdhName:fdhName||'', at:nowStamp(), status:'RECOMMENDED' };
  if(!DB.recommendations) DB.recommendations = [];
  DB.recommendations.push(rec);
  markChange();
  return rec;
}
/* 配對結果卡片 → 一鍵帶入 WA 範本（帶外傭編號＋摘要），並記錄推薦 */
function openMatchWa(code){
  const h = DB.helpers.find(function(x){ return x.code === code; });
  if(!h) return;
  const emp = DB.employers.find(function(e){ return e.code === MATCH_STATE.empCode; });
  const empCode = emp ? emp.code : '';
  const payload = {
    kind:'fdh', code:h.code, name:h.nickname || h.engName,
    sub: h.code + ' · ' + (h.nationality === 'PH' ? 'Filipino' : 'Indonesian'),
    phone: normPhone(h.nationality === 'PH' ? h.phonePH : (h.nationality === 'ID' ? h.phoneIndo : h.phoneHK)),
    grp:'ALL',
    recommend:{
      title: t('rec.waTitle'), code: h.code, name: h.engName || h.nickname || '',
      summary: helperSummary(h),
      empLabel: t('match.emp'), empName: emp ? (emp.nickname || emp.salutation || emp.code) : ''
    }
  };
  const dup = empCode ? recList(empCode).filter(function(r){ return r.fdhCode === code; })[0] : null;
  if(dup){
    /* 防呆：同一僱主重複推薦同一人選 → 提示但准許覆蓋 */
    openConfirm(t('rec.dupTitle'),
      '<p class="text-sm">'+esc(t('rec.dupMsg').split('{code}').join(dup.fdhCode || dup.fdhName || code))+'</p>',
      function(){ openWATab(payload); });
    return;
  }
  if(empCode) recordRecommendation(empCode, code, h.engName || h.nickname);
  openWATab(payload);
}

function buildWATabDoc(cfg){
