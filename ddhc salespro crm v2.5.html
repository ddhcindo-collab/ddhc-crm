/* ═════════ 客服知識庫模組（中文版 + 英文版；6 大階段分類；範本可隨時修改／增刪／人工輸入） ═════════ */
/* WhatsApp 模組：四語言（中 / ENG / INDO / Tagalog），範本按語言分庫，無階段分類
   send='emp' → 發送時選僱主；send='helper' → 發送時選外傭（INDO 選印尼傭、Tagalog 選菲律賓傭） */
const KB_LANGS = [
  {id:'zh',   label:'中',       ui:'zh', seed:true,  send:'emp',    nat:null},
  {id:'en',   label:'ENG',      ui:'en', seed:false, send:'emp',    nat:null},
  {id:'indo', label:'INDO',     ui:'en', seed:false, send:'helper', nat:'ID'},
  {id:'tag',  label:'Tagalog',  ui:'en', seed:false, send:'helper', nat:'PH'}
];
let WA_LANG = 'zh';
const KB_STATE = { zh:{}, en:{}, indo:{}, tag:{} };
Object.keys(KB_STATE).forEach(k=>{ KB_STATE[k] = { search:'', recSearch:'' }; });
/* 介面文案：zh 用中文；en / indo / tag 用英文（INDO/Tagalog 板塊界面英文，內容空白） */
const KB_UI = {
  zh:{ search:'搜尋範本／關鍵字…', add:'新增範本', cnt:'個範本', restore:'還原預設範本',
    copy:'複製', send:'發送', edit:'編輯', del:'刪除', empty:'沒有符合的範本 — 可點「新增範本」人工輸入',
    ttl:'標題 *', bdy:'內容 *', need:'請輸入標題及內容', pick:'選擇對象發送 — ',
    sRec:'搜尋僱主…', noRec:'沒有符合的僱主', saved:'已儲存 ✓', deleted:'已刪除 ✓', confirmed:'確認還原內建預設範本？' },
  en:{ search:'Search template / keyword…', add:'New Template', cnt:'templates', restore:'Restore Built-in',
    copy:'Copy', send:'Send', edit:'Edit', del:'Delete', empty:'No matching template — click "New Template" to write one',
    ttl:'Title *', bdy:'Content *', need:'Please enter both title and content', pick:'Send to recipient — ',
    sRec:'Search employer…', noRec:'No matching employer', saved:'Saved ✓', deleted:'Deleted ✓', confirmed:'Restore the built-in templates?' }
};
function waLangMeta(lang){ return KB_LANGS.find(x=>x.id===lang) || KB_LANGS[0]; }
function waUI(lang){ const m = waLangMeta(lang); return KB_UI[m.ui] || KB_UI.zh; }
/* ★ 重要：搜尋框只重繪清單（updateWaList），唔整體重繪 renderWA → 避免輸入時輸入框失焦，修復「搜尋框無反應」 */
function renderWA(lang){
  lang = lang||'zh';
  WA_LANG = lang;
  const el = document.getElementById('waBody'); if(!el) return;
  const U = waUI(lang);
  const ST = KB_STATE[lang];
  el.innerHTML = `
  <div class="flex flex-wrap items-center gap-2 mb-3">
    <div class="relative flex-1 min-w-[220px]">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 muted"></i>
      <input id="waSearch" class="inp !pl-9" placeholder="${esc(U.search)}" value="${esc(ST.search)}">
    </div>
    <button id="waAdd" class="btn btn-pri !min-h-[38px] !py-1.5"><i data-lucide="plus" class="w-4 h-4"></i>${U.add}</button>
    <button id="waRestore" class="btn btn-sec !min-h-[38px] !py-1.5"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>${U.restore}</button>
    <span class="badge b-blue" id="waCnt"></span>
  </div>
  <div class="space-y-2 max-w-[980px]" id="waList"></div>`;
  refreshIcons();
  /* 語言切換列（中 / ENG / INDO / Tagalog） */
  const bar = document.getElementById('waLangBar');
  if(bar){
    bar.innerHTML = KB_LANGS.map(x=>`<button class="chip ${x.id===lang?'on':''}" data-walang="${x.id}">${x.label}</button>`).join('');
    bar.querySelectorAll('[data-walang]').forEach(b=>b.onclick=()=>renderWA(b.dataset.walang));
  }
  /* 搜尋：只重繪清單，唔整體重繪 → 唔會失焦（修復搜尋框無反應） */
  let deb = debounce(v=>{ ST.search=v; updateWaList(lang); },300);
  el.querySelector('#waSearch').oninput = e=>deb(e.target.value);
  el.querySelector('#waAdd').onclick = ()=>openTplEdit(null, lang);
  el.querySelector('#waRestore').onclick = ()=>{
    openConfirm(U.restore, `<p class="text-sm">${U.confirmed}</p>`, ()=>{
      const n = kbTplRestore(lang); toast(U.saved+' ('+n+')','ok'); updateWaList(lang);
    });
  };
  updateWaList(lang);
}
/* 只重繪範本清單（保留搜尋輸入框焦點，修復搜尋框無反應） */
function updateWaList(lang){
  lang = lang || 'zh';
  const el = document.getElementById('waBody'); if(!el) return;
  const U = waUI(lang);
  const ST = KB_STATE[lang];
  const all = kbTplAll(lang);
  const q = ST.search.trim().toLowerCase();
  const list = all.filter(x=> !q || ((x.title||'')+' '+(x.body||'')).toLowerCase().includes(q));
  const cnt = el.querySelector('#waCnt'); if(cnt) cnt.textContent = list.length + ' ' + U.cnt;
  const host = el.querySelector('#waList'); if(!host) return;
  host.innerHTML = list.map(x=>`
    <div class="card p-4">
      <div class="flex items-start justify-between gap-2 flex-wrap">
        <div class="flex items-center gap-2 flex-wrap">
          <b class="text-sm">${esc(x.title)}</b>
          <span class="text-[10px] muted">${esc(x.id)}</span>
        </div>
        <div class="flex gap-1.5 shrink-0">
          <button class="btn btn-sec !min-h-[32px] !py-1 !px-2.5 text-xs" data-kbcopy="${x.id}"><i data-lucide="copy" class="w-3.5 h-3.5"></i>${U.copy}</button>
          <button class="btn btn-green !min-h-[32px] !py-1 !px-2.5 text-xs" data-kbsend="${x.id}"><i data-lucide="send" class="w-3.5 h-3.5"></i>${U.send}</button>
          <button class="btn btn-sec !min-h-[32px] !py-1 !px-2.5 text-xs" data-kbedit="${x.id}"><i data-lucide="pencil" class="w-3.5 h-3.5"></i>${U.edit}</button>
          <button class="btn btn-red !min-h-[32px] !py-1 !px-2.5 text-xs" data-kbdel="${x.id}"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i>${U.del}</button>
        </div>
      </div>
      <div class="rounded border bd p-3 text-sm whitespace-pre-wrap bg-gray-50 dark:bg-slate-800 mt-2">${esc(x.body)}</div>
    </div>`).join('') || `<p class="muted text-sm p-4 card">${U.empty}</p>`;
  refreshIcons();
  host.querySelectorAll('[data-kbcopy]').forEach(b=>b.onclick=()=>{ const x=kbTplAll(lang).find(y=>y.id===b.dataset.kbcopy); if(x) copyText(x.body, '已複製 ✓'); });
  host.querySelectorAll('[data-kbsend]').forEach(b=>b.onclick=()=>openKBSend(b.dataset.kbsend, lang));
  host.querySelectorAll('[data-kbedit]').forEach(b=>b.onclick=()=>openTplEdit(kbTplAll(lang).find(y=>y.id===b.dataset.kbedit), lang));
  host.querySelectorAll('[data-kbdel]').forEach(b=>b.onclick=()=>{
    const x = kbTplAll(lang).find(y=>y.id===b.dataset.kbdel); if(!x) return;
    openConfirm(U.del, `<p class="text-sm">確定刪除「${esc(x.title)}」？</p>`,
      ()=>{ kbTplDel(lang, x.id); toast(U.deleted,'ok'); updateWaList(lang); });
  });
}
/* ── 新增／編輯範本（人工輸入） ── */
function openTplEdit(x, lang){
  lang = lang||'zh';
  const U = waUI(lang);
  const isNew = !x;
  openModal(isNew?U.add:U.edit, `
    <div class="text-sm space-y-3">
      <div><label class="text-xs muted">${U.ttl}</label><input id="tplTitle" class="inp" value="${esc(x?x.title:'')}"></div>
      <div><label class="text-xs muted">${U.bdy}</label><textarea id="tplBody" class="inp" rows="6">${esc(x?x.body:'')}</textarea></div>
    </div>`,
    ()=>{ const title = document.getElementById('tplTitle').value.trim();
      const body = document.getElementById('tplBody').value.trim();
      if(!title || !body){ alert(U.need); return false; }
      if(isNew) kbTplAdd(lang, title, body);
      else kbTplUpd(lang, x.id, {title, body});
      toast(U.saved,'ok'); updateWaList(lang);
    });
}
/* ── WhatsApp 發送：中/ENG 選僱主；INDO/Tagalog 選 Helper（印傭/菲傭） ── */
function openKBSend(tplId, lang){
  lang = lang||'zh';
  const U = waUI(lang);
  const ST = KB_STATE[lang];
  const meta = waLangMeta(lang);
  const x = kbTplAll(lang).find(y=>y.id===tplId); if(!x) return;
  const isHelper = meta.send==='helper';
  const recLabel = isHelper
    ? (lang==='indo' ? 'Cari pembantu (Indonesia)…' : 'Search helper (Filipino)…')
    : U.sRec;
  const noRecMsg = isHelper
    ? (lang==='indo' ? 'Tiada pembantu sepadan' : 'No matching helper')
    : U.noRec;
  openModal(U.pick+esc(x.title), `
    <div class="text-sm space-y-2">
      <div class="rounded border bd p-3 whitespace-pre-wrap bg-gray-50 dark:bg-slate-800 max-h-32 overflow-y-auto text-xs">${esc(x.body)}</div>
      <div class="relative"><i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 muted"></i>
        <input id="kbRecSearch" class="inp !pl-9" placeholder="${esc(recLabel)}" value="${esc(ST.recSearch||'')}"></div>
      <div id="kbRecList" class="max-h-72 overflow-y-auto divide-y bd rounded border bd"></div>
    </div>`,
    null, {lockBg:true});
  refreshIcons();
  const draw = ()=>{
    const qs = (ST.recSearch||'').trim().toLowerCase();
    let list;
    if(isHelper){
      list = DB.helpers.filter(h=>(!meta.nat || h.nationality===meta.nat) && (!qs || [h.code,h.nickname,h.engName,h.phoneHK,h.phonePH,h.phoneIndo].some(v=>String(v||'').toLowerCase().includes(qs)))).slice(0,30);
    } else {
      list = DB.employers.filter(e=>!qs || [e.code,e.salutation,e.erNameZh,e.nickname,e.phone,e.whatsapp,e.sales].some(v=>String(v||'').toLowerCase().includes(qs))).slice(0,30);
    }
    document.getElementById('kbRecList').innerHTML = (isHelper
      ? list.map(h=>`
        <div class="flex items-center gap-2 px-3 py-2 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 cursor-pointer kbRecRow" data-code="${esc(h.code)}">
          <div class="flex-1"><b class="text-sm">${esc(h.nickname||h.engName)}</b>
            <div class="text-xs muted">${esc(h.code)} · ${h.nationality==='PH'?'Filipino':'Indonesian'}</div></div>
          <i data-lucide="message-circle" class="w-4 h-4 text-green-600"></i>
        </div>`).join('')
      : list.map(e=>`
        <div class="flex items-center gap-2 px-3 py-2 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 cursor-pointer kbRecRow" data-code="${esc(e.code)}">
          <div class="flex-1"><b class="text-sm">${esc(e.nickname||e.salutation)}</b>${e.erNameZh?` <span class="text-xs muted">${esc(e.erNameZh)}</span>`:''}
            <div class="text-xs muted">${esc(e.code)} · ${esc(e.phone||'')}</div></div>
          <i data-lucide="message-circle" class="w-4 h-4 text-green-600"></i>
        </div>`).join('')
    ) || `<p class="muted text-sm p-4">${noRecMsg}</p>`;
    refreshIcons();
    document.querySelectorAll('.kbRecRow').forEach(r=>r.onclick=()=>{
      if(isHelper){
        const h = DB.helpers.find(y=>y.code===r.dataset.code); if(!h) return;
        closeModalAnd(()=>openWATab({ kind:'fdh', code:h.code, name:h.nickname||h.engName,
          sub:h.code+' · '+(h.nationality==='PH'?'Filipino':'Indonesian'),
          phone:normPhone(h.nationality==='PH'?h.phonePH:(h.nationality==='ID'?h.phoneIndo:h.phoneHK)),
          grp:'ALL', salutation:h.nickname||h.engName, preset:kbFill(x.body, null), kbLang:lang }));
      } else {
        const emp = DB.employers.find(y=>y.code===r.dataset.code); if(!emp) return;
        closeModalAnd(()=>openWATab({ kind:'emp', code:emp.code, name:emp.nickname||emp.salutation, sub:emp.code+' · '+(emp.stage?td(emp.stage):''),
          phone:String(emp.whatsapp||emp.phone||'').replace(/\D/g,''),
          grp:'ALL', salutation:emp.salutation, preset:kbFill(x.body, emp), kbLang:lang }));
      }
    });
  };
  let deb = debounce(v=>{ ST.recSearch=v; draw(); },300);
  document.getElementById('kbRecSearch').oninput = e=>deb(e.target.value);
  draw();
}
</script>

<!-- ══════════ Script 14：智能問卷・資料轉換（第十四輪新增） ══════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════════════
   第十四輪（2026-10-26）新增模組：「智能問卷・資料轉換」
   流程：揀工人／手動輸入 → 產生「固定格式問卷」(45 題) → 經 WhatsApp 發送
        → 貼上工人回覆 → 智能解析（中英・編號式・語句式皆支援）→ 核對 → 寫入資料庫
   設計原則：① 解析結果全部可改，寫入前必人手核對；② 解析失敗唔會丟原資料；
            ③ 問卷格式與網站「個人紀錄」一一對應，回覆可以直接變成網站格式。
   ═══════════════════════════════════════════════════════════════════════ */

/* ───────── 模組狀態（唔持久化；重新進入模組會重設） ───────── */
const SURVEY_STATE = {
  helperCode:'', name:'', phone:'', qText:'', reply:'', parsed:null, target:'new', search:''
};

/* ═════════ 值正規化工具（解析器用） ═════════ */
function normYesNo(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  if(!s) return '';
  if(/^(y|yes|true|1|是|有|可以|能|願意|願|ok|okay|good|√|✔)/.test(s)) return 'YES';
  if(/^(n|no|false|0|否|冇|無|唔|不|不能|不可|拒絕|×|✘|✗)/.test(s)) return 'NO';
  if(/\b(yes|can|could|will|able|willing)\b/.test(s)) return 'YES';
  if(/\b(no|not|cannot|can't|refuse)\b/.test(s)) return 'NO';
  if(s.indexOf('可以')===0||s.indexOf('願意')===0||s.indexOf('同意')===0) return 'YES';
  if(s.indexOf('唔可以')===0||s.indexOf('不願意')===0||s.indexOf('唔願意')===0||s.indexOf('拒絕')===0) return 'NO';
  return '';
}
function normNum(v){
  if(v===undefined||v===null||v==='') return 0;
  const s=String(v).replace(/,/g,'').replace(/[^\d.\-]/g,'');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
/* ▼ SURVEY_MONTHS → crm-data.js */
function normSurveyDate(v){
  const s=String(v==null?'':v).trim();
  if(!s) return '';
  let m;
  /* Excel 日期序號 */
  if(/^\d{5}$/.test(s)){ const d=new Date(Math.round((+s-25569)*86400000));
    if(!isNaN(d)) return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  /* 2024-01-04 / 2024/01/04 / 2024.01.04 / 2024年1月4日 */
  m=s.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]?\s*(\d{1,2})?/);
  if(m) return `${m[1]}-${pad2(+m[2])}-${pad2(+(m[3]||1))}`;
  /* 04/01/2024 → 假設 DD/MM/YYYY（香港習慣） */
  m=s.match(/^(\d{1,2})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{4})$/);
  if(m) return `${m[3]}-${pad2(+m[2])}-${pad2(+m[1])}`;
  /* 1 Jan 1990 */
  m=s.match(/^(\d{1,2})\s*[-\s]?\s*([A-Za-z]{3,})\.?\s*[-\s]?\s*,?\s*(\d{4})$/);
  if(m){ const mo=SURVEY_MONTHS[m[2].toLowerCase().slice(0,3)]; if(mo) return `${m[3]}-${pad2(mo)}-${pad2(+m[1])}`; }
  /* 只有年份 */
  m=s.match(/^(\d{4})/);
  if(m) return `${m[1]}-01-01`;
  return '';
}
/* enum 文字正規化：統一小寫 + 底線／連字號視為空格（令 HIGH_SCHOOL / SINGLE_PARENT 等碼可被比對） */
function normTxt(v){ return String(v==null?'':v).trim().toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' '); }
function normNat(v){
  const s=normTxt(v);
  if(!s) return '';
  if(/(ph|philippin|菲律賓|菲傭|菲籍|filipino)/.test(s)) return 'PH';
  if(/(indonesia|印尼|印傭|印尼籍|indonesian)/.test(s)) return 'ID';
  return 'OTHER';
}
function normMarital(v){
  const s=normTxt(v);
  if(!s) return '';
  if(/(single\s*parent|單親|單親媽媽|單親爸爸)/.test(s)) return 'SINGLE_PARENT';
  if(/(married|已婚|結婚|夫妻)/.test(s)) return 'MARRIED';
  if(/(divorc|離婚)/.test(s)) return 'DIVORCED';
  if(/(widow|喪偶|寡婦|寡夫)/.test(s)) return 'WIDOWED';
  if(/(separat|分居)/.test(s)) return 'SEPARATED';
  if(/(unmarried\s*partner|未婚伴侶|伴侶|partner)/.test(s)) return 'PARTNER';
  if(/(single|未婚|單身|未結婚)/.test(s)) return 'SINGLE';
  return '';
}
function normEdu(v){
  const s=normTxt(v);
  if(!s) return '';
  if(/(university|大學|bachelor|大學畢業|graduat)/.test(s)) return 'UNIVERSITY';
  if(/(college|大專|專科|associate|diploma)/.test(s)) return 'COLLEGE';
  if(/(vocational|職業訓練|職訓|技職|nursing)/.test(s)) return 'VOCATIONAL';
  if(/(elementary|primary\s*school|primary|小學|小学|小學畢業)/.test(s)) return 'ELEMENTARY';
  if(/(high\s*school|senior\s*high|中學|初中|高中|secondary|smear)/.test(s)) return 'HIGH_SCHOOL';
  return '';
}
function normRelig(v){
  const s=normTxt(v);
  if(!s) return '';
  if(/(catholic|天主教|羅馬天主教)/.test(s)) return 'CATHOLIC';
  if(/(christian|基督教|基督徒|jesus|耶穌|christ|基督)/.test(s)) return 'CHRISTIAN';
  if(/(muslim|islam|回教|伊斯蘭|回民|moslem)/.test(s)) return 'MUSLIM';
  if(/(buddh|佛教|和尚|尼姑|佛)/.test(s)) return 'BUDDHIST';
  if(/(hindu|印度教)/.test(s)) return 'OTHER';
  if(/(other|其他)/.test(s)) return 'OTHER';
  return '';
}
function normLang(v){
  const s=normTxt(v);
  if(!s) return '';
  if(/(native|母語|母语)/.test(s)) return 'NATIVE';
  if(/(learning|學習中|學習|初學|beginner)/.test(s)) return 'LEARNING';
  if(/(good|良好|好|流利|excellent|精通|perfect)/.test(s)) return 'GOOD';
  if(/(average|fair|一般|中等|普通|ok|okay)/.test(s)) return 'FAIR';
  if(/(none|nil|n\/a|na|不懂|不會|無|唔識|zero|不會說)/.test(s)) return 'NONE';
  return '';
}
/* 最擅長工作意向：接受 code（BABY…）或中英文字 */
function normBestInterest(v){
  const s=String(v||'').trim().toUpperCase();
  if(!s) return '';
  if(BEST_INTERESTS.includes(s)) return s;
  if(/BABY|嬰|BB/.test(s)) return 'BABY';
  if(/CHILD|小童|小朋友/.test(s)) return 'CHILDREN';
  if(/ELDER|長者|老人/.test(s)) return 'ELDERLY';
  if(/HOUSEWORK|CLEAN|HOUSE.?WORK|家務|清潔|洗衣/.test(s)) return 'HOUSEWORK';
  if(/COOK|煮|烹飪/.test(s)) return 'COOKING';
  if(/MULTI|多工|多項/.test(s)) return 'MULTITASK';
  return '';
}
/* 技能關鍵字比對（關鍵字表 SKILL_KEYWORDS；只做包含比對，大小寫不敏感） */
function normSkills(v){
  const s=String(v||'').toLowerCase();
  if(!s.trim()) return [];
  const out=[];
  SKILL_KEYWORDS.forEach(([code,kws])=>{ if(kws.some(w=>s.indexOf(w)!==-1) && out.indexOf(code)===-1) out.push(code); });
  /* 直接出現 CRM 技能碼（S_NEWBORN 等）亦當命中 —— 令「代碼↔文字」來回轉換唔會失真 */
  SKILLS.forEach(code=>{ if(s.indexOf(code.toLowerCase())>=0 && out.indexOf(code)===-1) out.push(code); });
  return out;
}
/* 子女明細：解析「兒子 2 個 年齡 4,9 / Son 2 ages 4,9」→ [{g:'SON',count,ages:[]},…]
   totalHint = 問卷第 6 題（子女總數）—— 用嚟判斷數字係「人數」定「年齡」 */
function parseChildrenDetail(raw, totalHint){
  const t=String(raw||'').trim();
  if(!t) return [];
  /* 將獨立的「男 / 女」轉成「兒子 / 女兒」，方便統一處理 */
  let pre=t.replace(/(^|[\s,，、;；])男(?=\s*\d)/g,'$1兒子').replace(/(^|[\s,，、;；])女(?=\s*\d)/g,'$1女兒');
  const re=/(兒子|儿子|son|sons?|boy|boys|女兒|女儿|daughter|daughters?|girl|girls)/gi;
  const parts=[]; let m, last=0, lastG=null;
  const sexOf=w=>/(兒子|儿子|son|boy|男)/i.test(w)?'SON':'DAUGHTER';
  while((m=re.exec(pre))!==null){
    if(m.index>last && lastG) parts.push({g:lastG, txt:pre.slice(last,m.index)});
    lastG=sexOf(m[0]); last=m.index+m[0].length;
  }
  if(last<pre.length && lastG) parts.push({g:lastG, txt:pre.slice(last)});
  if(!parts.length) return [];
  /* 每段抽數字 */
  const segs=parts.map(p=>{
    const nums=(p.txt.match(/\d+/g)||[]).map(Number);
    return {g:p.g, nums};
  });
  const allNums=segs.reduce((a,s)=>a.concat(s.nums),[]);
  const total=numToInt(totalHint);
  /* 判斷模式：數字總數 === 子女總數 → 全部當「年齡」；否則每段第一個數當「人數」 */
  const allAges = (total>0 && allNums.length===total);
  const out=[];
  segs.forEach(s=>{
    if(!s.nums.length) return;
    let count=0, ages=[];
    if(allAges){ count=s.nums.length; ages=s.nums.slice(); }
    else if(s.nums.length===1){ count=s.nums[0]; }
    else { count=s.nums[0]; ages=s.nums.slice(1); }
    const ex=out.find(o=>o.g===s.g);
    if(ex){ ex.count+=count; ex.ages=ex.ages.concat(ages); }
    else out.push({g:s.g, count, ages});
  });
  return out;
}
function numToInt(v){ const n=Number(v); return isNaN(n)?0:Math.round(n); }

/* ═════════ 問卷文字生成（固定格式 45 題） ═════════ */
function surveyKnownValues(h){
  if(!h) return {};
  const wh=(h.workHistory&&h.workHistory[0])||{};
  return {
    engName:h.engName||'', code:h.code||'', nationality:h.nationality||'', birth:fmtDate(h.birth),
    marital:h.marital||'', children:(h.children||0), education:h.education||'',
    religion:h.religion||'', height:(h.height||0), weight:(h.weight||0),
    langCt:h.langCt||'', langEn:h.langEn||'', langPtn:h.langPtn||'',
    skills:(h.skills||[]).map(td).join('、'),
    expID:(h.expID||0), contractDone:(h.contractDone||0),
    whLocation:wh.location||'', whPeriod:wh.period||'', whHouseSize:wh.houseSize||'',
    whPersons:wh.persons||'', whHoliday:wh.holiday||'', whNoMaid:wh.noMaid||'',
    whSalary:wh.salary||'', whReason:wh.reason||'',
    email:h.email||'', facebook:h.facebook||'', bestInterest:h.bestInterest||'', expSummary:h.expSummary||'',
    qa_pork:(h.generalQA||{}).pork||''
  };
}
function childrenDetailToText(arr){
  if(!Array.isArray(arr)||!arr.length) return '';
  return arr.map(c=>{
    const label = c.g==='SON' ? (CUR_LANG==='zhHant'?'兒子':'Son') : (CUR_LANG==='zhHant'?'女兒':'Daughter');
    return `${label} ${c.count||0}` + (Array.isArray(c.ages)&&c.ages.length ? ` (${c.ages.join(',')})` : '');
  }).join(', ');
}
/* 問題類型 → 顯示用提示（問卷括號內的選項提示） */
function surveyHint(q){
  const zh = CUR_LANG==='zhHant';
  switch(q.type){
    case 'nat':    return zh?'(PH 菲律賓 / ID 印尼 / OTHER 其他)':'(PH Filipino / ID Indonesian / OTHER)';
    case 'marital':return zh?'(SINGLE 未婚 / MARRIED 已婚 / DIVORCED 離婚 / WIDOWED 喪偶)':'(SINGLE / MARRIED / DIVORCED / WIDOWED)';
    case 'edu':    return zh?'(HIGH_SCHOOL 中學 / COLLEGE 大專 / UNIVERSITY 大學 / VOCATIONAL 職業訓練)':'(HIGH_SCHOOL / COLLEGE / UNIVERSITY / VOCATIONAL)';
    case 'relig':  return zh?'(CHRISTIAN 基督教 / CATHOLIC 天主教 / MUSLIM 回教 / BUDDHIST 佛教 / OTHER 其他)':'(CHRISTIAN / CATHOLIC / MUSLIM / BUDDHIST / OTHER)';
    case 'lang':   return zh?'(GOOD 好 / FAIR 一般 / NONE 唔識 / LEARNING 學習中)':'(GOOD / FAIR / NONE / LEARNING)';
    case 'date':   return '(YYYY-MM-DD)';
    case 'bool':   return zh?'(Yes 是 / No 否)':'(Yes / No)';
    case 'num':    return zh?'(數字 number)':'(number)';
    case 'children':return zh?'(例如: Son 2 ages 4,9 / 兒子2 年齡4,9)':'(e.g. Son 2 ages 4,9)';
    case 'bi':     return '(' + BEST_INTERESTS.map(b=>b+' '+td(b)).join(' / ') + ')';
    default: return '';
  }
}
function buildSurveyText(helper){
  const zh = CUR_LANG==='zhHant';
  const known = surveyKnownValues(helper);
  const name = known.engName || SURVEY_STATE.name || '';
  let out = (zh
    ? '【嘉勝人力資源・個人資料問卷】\n請逐題作答，每題格式：題號. 答案。\n已知資料我哋已填好，請覆核；唔清楚嘅可以留空。\n'
    : '【Ka Shing Personal Information Questionnaire】\nPlease answer each question. Format: No. Answer.\nWe have pre-filled what we know — please check; leave blank if unsure.\n');
  if(name) out += (zh?`姓名：${name}\n`: `Name: ${name}\n`);
  SURVEY_QUESTIONS.forEach(q=>{
    const label = zh ? `${q.zh} ${q.en}` : `${q.en} ${q.zh}`;
    const hint = surveyHint(q);
    const k = known[q.key];
    let val = (k!==undefined && k!==null && k!=='') ? String(k) : '';
    if(val==='' && q.type==='bool') val = '';
    out += `${q.n}. ${label}${hint?(' '+hint):''}: ${val}\n`;
  });
  out += (zh?'\n填完請直接 WhatsApp 回覆本公司，多謝！\n':'\nPlease reply to us on WhatsApp. Thank you!\n');
  return out;
}

/* ═════════ 問卷回覆解析器 ═════════ */
function buildSurveyAliasIndex(){
  const idx={};
  SURVEY_QUESTIONS.forEach(q=>{
    const list=[q.zh, q.en].concat(q.alias||[]);
    list.forEach(a=>{
      const k=String(a||'').trim().toLowerCase();
      if(k && idx[k]===undefined) idx[k]=q.key;
    });
  });
  /* 一般諮詢 8 條題目全文（Yes/No 題）→ 對應 qa_* key */
  GENERAL_QA.forEach(g=>{
    const key='qa_'+g.k;
    [g.zh, g.en].forEach(a=>{
      const k=String(a||'').trim().toLowerCase();
      if(k && idx[k]===undefined) idx[k]=key;
      const k2=k.replace(/[?？。.\s]+$/,'');
      if(k2 && idx[k2]===undefined) idx[k2]=key;
    });
  });
  return idx;
}
const SURVEY_ALIAS = buildSurveyAliasIndex();

function surveyTypeCast(q, raw, ctx){
  const v=String(raw==null?'':raw).trim();
  switch(q.type){
    case 'num':     return normNum(v);
    case 'date':    return normSurveyDate(v);
    case 'bool':    return normYesNo(v);
    case 'nat':     return normNat(v);
    case 'marital': return normMarital(v);
    case 'edu':     return normEdu(v);
    case 'relig':   return normRelig(v);
    case 'lang':    return normLang(v);
    case 'skills':  return normSkills(v);
    case 'children':return parseChildrenDetail(v, ctx.totalChildren);
    case 'bi':      return normBestInterest(v);
    default:        return v;
  }
}
/* 解析回覆文字 → {typed:{}, src:{}, unmatched:[], raw:{}} */
function parseSurveyReply(text){
  const res={typed:{},src:{},unmatched:[],raw:{}};
  if(!text || !String(text).trim()) return res;
  const lines=String(text).split(/\r?\n/);
  lines.forEach((line,li)=>{
    const trimmed=line.trim();
    if(!trimmed) return;
    let key=null, val='';
    /* ① 題號式：12. 值 / 12) 值 / 12: 值 */
    let m=trimmed.match(/^(\d{1,2})\s*[.、．。\)）:：\-–—]\s*(.*)$/);
    if(m){
      const q=SURVEY_QUESTIONS.find(x=>x.n===parseInt(m[1],10));
      if(q){ key=q.key; val=m[2]; }
    }
    /* ② 標籤式：label: value（行首） */
    if(key===null){
      let idx=-1;
      for(const ch of [':','：']){ const i=trimmed.indexOf(ch); if(i>=0 && (idx<0||i<idx)) idx=i; }
      if(idx>0 && idx<70){
        const label=trimmed.slice(0,idx).trim().toLowerCase().replace(/[?？。.\s]+$/,'');
        const k=SURVEY_ALIAS[label];
        if(k){ key=k; val=trimmed.slice(idx+1); }
      }
    }
    /* ③ 行內搜尋 label: value（允許標籤與冒號之間有 ? 或 空白） */
    if(key===null){
      for(const q of SURVEY_QUESTIONS){
        for(const a of [q.zh,q.en].concat(q.alias||[])){
          const re=new RegExp(String(a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[?？]?\\s*[:：]\\s*(.+)$','i');
          const mm=trimmed.match(re);
          if(mm){ key=q.key; val=mm[1]; break; }
        }
        if(key) break;
      }
    }
    /* ③b 一般諮詢全文題目 */
    if(key===null){
      for(const g of GENERAL_QA){
        for(const a of [g.en,g.zh]){
          const re=new RegExp(String(a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:：]\\s*(.+)$','i');
          const mm=trimmed.match(re);
          if(mm){ key='qa_'+g.k; val=mm[1]; break; }
        }
        if(key) break;
      }
    }
    if(key===null){ res.unmatched.push({line:li+1, text:trimmed}); return; }
    val=val.trim();
    /* ④ 去掉「1. Name: ANNA」情況中重複嘅標籤前綴 */
    const colonIdx=val.search(/[:：]/);
    if(colonIdx>0){
      const lab=val.slice(0,colonIdx).trim().toLowerCase().replace(/[?？。.\s]+$/,'');
      if(SURVEY_ALIAS[lab]===key) val=val.slice(colonIdx+1).trim();
    }
    if(!val) return;
    res.raw[key]=val;
    res.src[key]=li+1;
  });
  /* 轉型：子女明細需要「子女總數」作提示 */
  const ctx={ totalChildren: normNum(res.raw.children) };
  SURVEY_QUESTIONS.forEach(q=>{
    if(res.raw[q.key]===undefined) return;
    const v=surveyTypeCast(q, res.raw[q.key], ctx);
    if(v==='' || v===undefined || (Array.isArray(v)&&!v.length)) return;
    res.typed[q.key]=v;
  });
  /* 技能碼 → 網站「工作意向」代碼（PROFILE_PRIORITY） */
  if(res.typed.skills){
    const sk=res.typed.skills;
    res.typed.profileExp = PROFILE_EXPERIENCE.filter(pe=>pe.skill && sk.indexOf(pe.skill)>=0).map(pe=>pe.k);
    if(sk.indexOf('S_DOG')>=0||sk.indexOf('S_CAT')>=0) if(res.typed.profileExp.indexOf('pet')<0) res.typed.profileExp.push('pet');
    res.typed.dutiesPriority = PROFILE_PRIORITY.filter(k=>res.typed.profileExp.indexOf(k)>=0);
  }
  return res;
}

/* ═════════ 模組渲染 ═════════ */
function renderSurvey(){
  const el=document.getElementById('surveyBody'); if(!el) return;
  const zh = CUR_LANG==='zhHant';
  el.innerHTML = `
  <div class="space-y-4">

/* 事件綁定（每次 renderSurvey 後重綁） */
function bindSurveyEvents(){
  const el=document.getElementById('surveyBody'); if(!el) return;
  const q=(s)=>el.querySelector(s);
  const nameEl=q('#svName'), phoneEl=q('#svPhone'), qEl=q('#svQ'), replyEl=q('#svReply');
  if(nameEl)  nameEl.oninput  = e=>{ SURVEY_STATE.name=e.target.value; };
  if(phoneEl) phoneEl.oninput = e=>{ SURVEY_STATE.phone=e.target.value; };
  if(qEl)     qEl.oninput     = e=>{ SURVEY_STATE.qText=e.target.value; };
  if(replyEl) replyEl.oninput = e=>{ SURVEY_STATE.reply=e.target.value; };
  const gen=q('#svGen'); if(gen) gen.onclick=()=>{
    const pick=q('#svHelperPick').value;
    const helper = pick ? DB.helpers.find(h=>h.code===pick) : null;
    SURVEY_STATE.helperCode = helper?helper.code:'';
    if(helper){ SURVEY_STATE.name=helper.engName||SURVEY_STATE.name; SURVEY_STATE.phone=normPhone(helper.phoneHK||helper.phonePH||helper.phoneIndo||''); }
    SURVEY_STATE.qText = buildSurveyText(helper);
    SURVEY_STATE.parsed=null;
    renderSurvey();
  };
  const sb=q('#svSearchBtn'); if(sb) sb.onclick=()=>{
    const v=(q('#svSearch').value||'').trim().toLowerCase();
    SURVEY_STATE.search=v;
    const box=q('#svSearchResult');
    const list=DB.helpers.filter(h=>{
      if(!v) return false;
      return [h.engName,h.nickname,h.code,h.extCode,h.phoneHK,h.phonePH,h.phoneIndo].some(x=>String(x||'').toLowerCase().indexOf(v)>=0);
    }).slice(0,20);
    if(!list.length){ box.innerHTML='<div class="text-xs muted mt-2">—</div>'; return; }
    box.innerHTML='<div class="mt-2 max-h-44 overflow-y-auto border rounded divide-y">'+list.map(h=>{
      const tel=normPhone(h.phoneHK||h.phonePH||h.phoneIndo||'');
      return `<div class="px-2 py-1.5 text-xs flex items-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-700">
        <b>${esc(h.engName||'—')}</b><span class="muted">${esc(h.code||'')}</span>
        <span class="muted">${esc(tel||'')}</span>
        <button class="btn btn-sec !min-h-[24px] !py-0.5 !px-2 ml-auto" data-pick="${esc(h.code)}">${t('survey.editBtn')}</button>
      </div>`;}).join('')+'</div>';
    box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const h=DB.helpers.find(x=>x.code===b.dataset.pick);
      if(!h) return;
      SURVEY_STATE.helperCode=h.code; SURVEY_STATE.name=h.engName||'';
      SURVEY_STATE.phone=normPhone(h.phoneHK||h.phonePH||h.phoneIndo||'');
      SURVEY_STATE.qText=buildSurveyText(h);
      const pick=q('#svHelperPick'); if(pick) pick.value=h.code;
      renderSurvey();
    });
  };
  const send=q('#svSend'); if(send) send.onclick=()=>{
    const txt=(q('#svQ').value||'').trim();
    if(!txt){ toast(t('survey.noParse'),'warn'); return; }
    const phone=normPhone(q('#svPhone').value||'');
    if(!phone){ toast(t('survey.manualPhone')+' — required','warn'); return; }
    SURVEY_STATE.qText=txt;
    recordSurvey('sent', txt);
    openWATab({kind:'fdh', code:SURVEY_STATE.helperCode||'', name:SURVEY_STATE.name||phone,
      sub:t('survey.title'), phone, preset:txt, grp:'ALL'});
  };
  const cp=q('#svCopy'); if(cp) cp.onclick=()=>{
    const txt=(q('#svQ').value||'').trim();
    if(!txt){ toast(t('survey.noParse'),'warn'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(t('survey.copied'),'ok')).catch(()=>fallbackCopy(txt,()=>toast(t('survey.copied'),'ok'))); }
    else fallbackCopy(txt,()=>toast(t('survey.copied'),'ok'));
  };
  const rs=q('#svReset'); if(rs) rs.onclick=()=>{
    const helper=SURVEY_STATE.helperCode?DB.helpers.find(h=>h.code===SURVEY_STATE.helperCode):null;
    SURVEY_STATE.qText=buildSurveyText(helper); SURVEY_STATE.parsed=null;
    renderSurvey();
  };
  const ps=q('#svParse'); if(ps) ps.onclick=()=>{
    const txt=(q('#svReply').value||'').trim();
    if(!txt){ toast(t('survey.noParse'),'warn'); return; }
    const parsed=parseSurveyReply(txt);
    const n=Object.keys(parsed.typed).length;
    if(!n){ toast(t('survey.noResult'),'error',7000); renderSurveyParseResult(parsed); return; }
    SURVEY_STATE.parsed=parsed; SURVEY_STATE.reply=txt;
    recordSurvey('parsed', txt);
    renderSurveyParseResult(parsed);
    toast(t('survey.parseDone',{ok:n, miss:SURVEY_QUESTIONS.length-n}),'ok');
  };
  const cr=q('#svClearReply'); if(cr) cr.onclick=()=>{ SURVEY_STATE.reply=''; SURVEY_STATE.parsed=null; renderSurvey(); };
  /* 工人下拉（載入全部工人） */
  const pick=q('#svHelperPick');
  if(pick){
    DB.helpers.slice(0,500).forEach(h=>{
      const o=document.createElement('option');
      o.value=h.code; o.textContent=`${h.engName||'—'} · ${h.code}${h.nickname?(' · '+h.nickname):''}`;
      if(h.code===SURVEY_STATE.helperCode) o.selected=true;
      pick.appendChild(o);
    });
  }
}

/* 問卷發送／解析紀錄（存 DB.surveys；上限 30 條，唔佔太多配額） */
function recordSurvey(status, text){
  if(!DB.surveys) DB.surveys=[];
  DB.surveys.push({ id:uid(), at:nowStamp(), name:SURVEY_STATE.name||'', phone:SURVEY_STATE.phone||'',
    helperCode:SURVEY_STATE.helperCode||'', status, qText:(status==='sent'?text:''), reply:(status==='sent'?'':text) });
  while(DB.surveys.length>30) DB.surveys.shift();
  markChange();
}
function renderSurveyHistory(){
  const box=document.getElementById('surveyHist'); if(!box) return;
  const arr=(DB.surveys||[]).slice().reverse();
  if(!arr.length){ box.innerHTML='<div class="text-xs muted">'+t('survey.histEmpty')+'</div>'; return; }
  const st={sent:'WhatsApp',parsed:'解析',saved:'已入庫'};
  box.innerHTML='<div class="max-h-52 overflow-y-auto border rounded divide-y text-xs">'+arr.map(s=>
    `<div class="px-2.5 py-1.5 flex items-center gap-2">
      <b>${esc(s.name||'—')}</b><span class="muted">${esc(s.phone||'')}</span>
      <span class="muted">${esc(s.at)}</span>
      <span class="ml-auto muted">${st[s.status]||s.status}</span>
    </div>`).join('')+'</div>';
}

function surveyRowDefs(){
  const zh=CUR_LANG==='zhHant';
  const rows=[];
  SURVEY_QUESTIONS.forEach(q=>{
    if(q.n>=26 && q.n<=33) return;                     /* 工作記錄另外處理 */
    if(q.type==='bool') return;                         /* 一般諮詢（Yes/No）另外處理；42–45 保留 */
    rows.push({ key:q.key, label:zh?`${q.zh} ${q.en}`:`${q.en} ${q.zh}`, type:q.type, qn:q.n });
  });
  return rows;
}

/* ═════════ 解析結果 → 資料庫 ═════════ */
function readSurveyInputs(box){
  const out={};
  box.querySelectorAll('[data-sv]').forEach(el=>{
    const k=el.dataset.sv; let v=el.value;
    if(k==='skillsText'){ out.skills=normSkills(v); return; }
    if(k==='childrenText'){ out.childrenDetail=parseChildrenDetail(v, normNum(out.children)); return; }
    out[k]=v;
  });
  return out;
}
function saveSurveyToDB(box){
  const vals=readSurveyInputs(box);
  const zh=CUR_LANG==='zhHant';
  const num=(k)=>vals[k]!==undefined&&vals[k]!==''?normNum(vals[k]):null;
  const str=(k)=>vals[k]!==undefined?String(vals[k]).trim():'';
  const engName=str('engName');
  if(!engName){ toast(t('fdh.engName')+' '+t('form.required'),'warn'); return; }
  /* 目標工人 */
  const code=str('code');
  let target=null;
  if(SURVEY_STATE.target==='update'){
    target = code ? DB.helpers.find(h=>h.code===code) : null;
    if(!target && engName) target = DB.helpers.find(h=>h.engName && h.engName.toLowerCase()===engName.toLowerCase());
  }else{
    if(code) target = DB.helpers.find(h=>h.code===code);
  }
  const isNew=!target;
  /* 編號：HKID／護照優先 → 問卷編號 → 暫用編號 */
  const hkid=str('hkid'), passport=str('passport');
  let newCode = hkid || passport || code || nextProvCode();
  if(!hkid && !passport && code && !isValidIdNum(code) && !isValidPassport(code)) newCode = nextProvCode();
  if(!isNew && target.code!==newCode){
    const dup=DB.helpers.find(h=>h.code===newCode);
    if(dup){ toast(t('form.dupId')+' — '+newCode,'error'); return; }
  }
  pushUndo();
  const obj = isNew ? {
    code:newCode, refNo:'', engName, nickname:'', nationality:'OTHER', birth:'',
    marital:'SINGLE', children:0, education:'HIGH_SCHOOL', langEn:'GOOD', langCt:'NONE', langPtn:'NONE',
    skills:[], expYears:0, contract:'FIND_JOB', workerClass:'GOOD', classReason:'', classAt:'',
    hkid:'', passport:'', contractExpiry:'',
    notes:'', phoneHK:'', phoneIndo:'', phonePH:'', email:'', facebook:'', bestInterest:'', expSummary:'',
    contractDone:0
  } : Object.assign({}, target);
  obj.engName=engName;
  if(str('nationality')) obj.nationality=str('nationality');
  if(str('maidType')) obj.maidType=str('maidType');
  else if(!obj.maidType && (obj.nationality==='PH'||obj.nationality==='ID')) obj.maidType='OVERSEAS';
  if(str('birth')) obj.birth=str('birth');
  if(str('marital')) obj.marital=str('marital');
  if(num('children')!==null) obj.children=num('children');
  if(str('education')) obj.education=str('education');
  if(str('religion')) obj.religion=str('religion');
  if(num('height')!==null) obj.height=num('height');
  if(num('weight')!==null) obj.weight=num('weight');
  if(str('langCt')) obj.langCt=str('langCt');
  if(str('langEn')) obj.langEn=str('langEn');
  if(str('langPtn')) obj.langPtn=str('langPtn');
  ['email','facebook','bestInterest','expSummary'].forEach(k=>{ const v=str(k); if(v!=='') obj[k]=v; });
  if(vals.skills && vals.skills.length) obj.skills=vals.skills;
  if(vals.profileExp && vals.profileExp.length) obj.profileExp=vals.profileExp;
  if(vals.dutiesPriority && vals.dutiesPriority.length) obj.dutiesPriority=vals.dutiesPriority;
  ['expID','contractDone'].forEach(k=>{
    const v=num(k); if(v!==null) obj[k]=v;
  });
  /* 工作記錄（問卷只問「上任僱主」一段） */
  const whMap={whLocation:'location',whPeriod:'period',whHouseSize:'houseSize',whPersons:'persons',
    whHoliday:'holiday',whNoMaid:'noMaid',whSalary:'salary',whReason:'reason'};
  const whVals={};
  Object.keys(whMap).forEach(k=>{ const v=str(k); if(v!=='') whVals[whMap[k]]=v; });
  if(Object.keys(whVals).length){
    const wh=Object.assign({location:'',period:'',houseSize:'',persons:'',holiday:'',noMaid:'',salary:'',reason:'',duties:[],remark:''}, whVals);
    if(!Array.isArray(obj.workHistory)) obj.workHistory=[];
    if(obj.workHistory.length) Object.assign(obj.workHistory[0], whVals);
    else obj.workHistory.push(wh);
  }
  /* 一般諮詢 */
  const gq=Object.assign({}, obj.generalQA||{});
  SURVEY_QUESTIONS.filter(q=>q.type==='bool').forEach(q=>{
    const v=str(q.key); if(v==='YES'||v==='NO') gq[q.key.replace('qa_','')]=v;
  });
  obj.generalQA=gq;
  /* 電話 */
  const phoneRaw=str('phone');
  if(phoneRaw){ const p=normPhone(phoneRaw); if(p){
    if(p.indexOf('852')===0) obj.phoneHK=p;
    else if(p.indexOf('63')===0) obj.phonePH=p;
    else if(p.indexOf('62')===0) obj.phoneIndo=p;
  } }
  /* 寫入 */
  if(isNew){ obj.code=newCode; obj.ownerEmail=(typeof newOwnerEmail==='function')?newOwnerEmail():''; DB.helpers.push(obj); }
  else{
    if(newCode!==target.code){
      const oldCode=target.code;
      DB.matchings.forEach(m=>{ if(m.fdhCode===oldCode) m.fdhCode=newCode; });
      DB.sendLog.forEach(l=>{ if(l.fdhCode===oldCode) l.fdhCode=newCode; });
      obj.code=newCode;
    }
    const i=DB.helpers.findIndex(x=>x.code===target.code);
    if(i>=0) DB.helpers[i]=obj;
  }
  recordSurvey('saved', SURVEY_STATE.reply||'');
  markChange();
  toast(t('survey.saved'),'ok');
  SURVEY_STATE.parsed=null; SURVEY_STATE.reply='';
  renderSurvey();
}
</script>

<!-- ══════════ Script 12：Init + 全域事件綁定 ══════════ -->
<script>
function bindGlobal(){
  /* 導覽 */
  document.querySelectorAll('#mainNav .nav-item').forEach(n=>n.onclick=()=>switchMod(n.dataset.mod));
  /* 語言 / 深色 */
  document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>{ PREFS.lang=b.dataset.lang; savePrefs(); refreshAll(); });
  document.getElementById('darkToggle').onclick = toggleDark;
  /* 底部操作 */
  document.getElementById('btnExport').onclick = exportJSON;
  document.getElementById('btnRestore').onclick = ()=>document.getElementById('restoreFile').click();
  document.getElementById('restoreFile').onchange = e=>{ if(e.target.files[0]) restoreJSON(e.target.files[0]); e.target.value=''; };
  document.getElementById('btnRefresh').onclick = ()=>{ refreshAll(); toast('Refreshed ✓','ok'); };
  /* Undo: Ctrl+Z（最近 20 步） */
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); doUndo(); }
    if(e.key==='Escape'){ const r=document.getElementById('modalRoot'); if(r && !document.getElementById('modalMask')){ const v=document.getElementById('resumeView'); if(v.style.display==='block'){ v.style.display='none'; document.body.classList.remove('printing'); } } }
  });
  /* 移動端 Sidebar */
  const sb = document.getElementById('sidebar'), mask = document.getElementById('sidebarMask');
  document.getElementById('hamburger').onclick = ()=>{ sb.classList.remove('-translate-x-full'); mask.classList.remove('hidden'); };
  mask.onclick = ()=>{ sb.classList.add('-translate-x-full'); mask.classList.add('hidden'); };
}

/* ── 初始化：載入資料 → 狀態 → refreshAll（固定順序，防禦性初始化） ── */
(function init(){
  seedIfEmpty();          // 載入草稿（無資料則空白起步；含 migrateDB 自動升級）
  mergePendingSends();    // WhatsApp 分頁發送紀錄合併回 sendLog
  window.addEventListener('focus', mergePendingSends);
  loadUndo();             // Undo 緩衝
  window.MATCH_CANDS = loadCands();   // 候選名單（持久化）
  applyDark();            // 深色模式
  bindGlobal();           // 事件綁定
  if(PREFS.empFilter) LIST_STATE.emp.filter = PREFS.empFilter;
  if(PREFS.empSales) LIST_STATE.emp.sales = PREFS.empSales;
  document.getElementById('brandName').textContent = DB.meta.companyName || 'Ka Shing Manpower';
  /* 登入閘門：未登入只顯示登入畫面；登入成功才 switchMod */
  if(checkLogin()){
    switchMod(CUR_MOD);
    checkImportHash();
    /* 自動同步資料夾：開機自動讀入資料夾內最新備份（需使用者先前授權過） */
    if(typeof fsAutoLoadOnStart === 'function'){
      fsAutoLoadOnStart().then(()=>{ if(CUR_MOD==='import') renderImport(); })
        .catch(()=>{});
    }
    /* 首次使用提示 */
    if(!DB.meta.lastExportedAt){
      setTimeout(()=>toast('💡 提示：資料存在瀏覽器中，請定期點擊「匯出 JSON」備份 (Export JSON to backup regularly)', 'warn', 8000), 1200);
    }
    /* 資料累積提醒 */
    if(DB.helpers.length + DB.employers.length >= 30){
      setTimeout(()=>toast('⚠ 資料已累積 30+ 筆，建議匯出 JSON 備份','warn',6000), 3000);
    }
  }
})();
</script>
