<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════
  Ka Shing Manpower Agency — 外傭中介自動化 CRM 工作臺 v1.0
  ═══════════════════════════════════════════════════════════════════
  【使用說明】
  1. 資料備份流程：
     - 所有業務資料儲存在瀏覽器記憶體 + localStorage 草稿（有 5MB 上限）。
     - 請養成習慣：每次修改資料後，點擊左側「匯出 JSON」下載備份檔
       （檔名 crm-backup-YYYYMMDD-HHmm.json）。
     - 還原：點擊「上載還原」選擇備份檔，完全取代現有資料（有二次確認）。
     - 系統自動保留最近 3 份輕量備份於 localStorage；草稿超過 2MB 會提示匯出。
  2. localStorage 限制：5000+ 筆資料的完整 JSON 可能達 3–8MB，超出上限，
     因此正式資料以「匯出 JSON 檔案」為準，localStorage 只存草稿與偏好。
  3. 外傭編號規則：以 HKID 號碼（6–7 位純數字，不含字母）為唯一來源；
     無 HKID 則用護照號碼（同樣 6–7 位純數字）。兩者皆空無法儲存。
     編號建立後不可修改；重複編號匯入時預設跳過（可改覆蓋）。
  4. Undo：Ctrl+Z 可撤銷最近 20 步操作。
  ═══════════════════════════════════════════════════════════════════
-->

<!-- ══════════ DSH 預覽相容層（v1）══════════
     只在「沙箱化 HTML 預覽」（例如 DeepSeek 右側欄的即時預覽 iframe）生效。
     沙箱預覽的 origin 是 opaque，原生 localStorage / sessionStorage 一存取就會拋
     SecurityError，會令 init() 在第一行就中斷（畫面空白）。呢層用記憶體版 Storage
     頂替，令預覽可以正常顯示；資料只存在今次預覽之內，絕對唔會寫入正式系統。
     正常用 Chrome 開檔（file://）或部署上網時，呢段完全唔會執行，行為不變。 -->
<script>
(function(){
  var sandboxed = false;
  try { window.localStorage.getItem('__dsh_preview_probe__'); } catch (e) { sandboxed = true; }
  if (!sandboxed) return;

  function memoryStorage(){
    var m = Object.create(null);
    return {
      getItem: function(k){ k = String(k); return (k in m) ? m[k] : null; },
      setItem: function(k, v){ m[String(k)] = String(v); },
      removeItem: function(k){ delete m[String(k)]; },
      clear: function(){ m = Object.create(null); },
      key: function(i){ var ks = Object.keys(m); return (i >= 0 && i < ks.length) ? ks[i] : null; },
      get length(){ return Object.keys(m).length; }
    };
  }
  var ls = memoryStorage(), ss = memoryStorage();
  function install(name, store){
    try { Object.defineProperty(window, name, { configurable: true, value: store }); return true; } catch (e) {}
    try { window[name] = store; return true; } catch (e) {}
    return false;
  }
  install('localStorage', ls);
  install('sessionStorage', ss);

  /* 預覽免登入：以 Admin 身份直接看介面（正式開檔時登入閘門照舊） */
  try { ls.setItem('wb_crm_user', 'Admin'); } catch (e) {}
  window.__DSH_PREVIEW__ = true;

  /* 右下角小標籤，提醒「而家睇緊嘅係預覽」 */
  window.addEventListener('load', function(){
    try {
      if (document.getElementById('dshPreviewBadge')) return;
      var b = document.createElement('div');
      b.id = 'dshPreviewBadge';
      b.textContent = '👁 即時預覽 · 資料不會寫入正式系統';
      b.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:2147483647;' +
        'background:#4f46e5;color:#fff;font:600 12px/1.4 -apple-system,"Microsoft JhengHei",sans-serif;' +
        'padding:7px 11px;border-radius:9999px;box-shadow:0 4px 14px rgba(15,23,42,.28);' +
        'pointer-events:none;opacity:.92;';
      document.body.appendChild(b);
    } catch (e) {}
  });
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* CDN 被擋／離線時 tailwind 未定義 → 用 typeof 防護，唔好拋未捕捉錯誤令全頁中止 */
  if (typeof tailwind !== 'undefined') tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } } } } };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  /* 圖示 CDN 未必載入得到（防火牆／離線／unpkg 掛咗）→ 提供安全 fallback。
     冇 icon 唔影響功能，但絕對唔可以因為咁樣令整個 render 中斷（會令按鈕事件綁定漏做＝看似「閃退」）。 */
  window.__lucideFallback = function(){
    document.querySelectorAll('i[data-lucide]').forEach(function(el){
      if(el.dataset.fallbackDone) return; el.dataset.fallbackDone='1';
      var n = (el.getAttribute('data-lucide')||'').replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
      el.textContent = n ? '·' : ''; el.setAttribute('title', el.getAttribute('title')||n);
    });
  };
  if (!window.lucide) window.__lucideFallback();
</script>

<script>
  /* crm-data.js 缺失／路徑錯 → 貼出提示，避免整頁白屏 */
  window.addEventListener('DOMContentLoaded', function(){
    if (typeof I18N === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:20px;margin:16px;border:2px solid #dc2626;border-radius:12px;color:#b91c1c;font:15px/1.6 sans-serif">'
        + '<b>⚠ crm-data.js 未載入</b><br>請確認 <code>crm-data.js</code> 與本檔案放在同一個資料夾內。</div>');
    }
  });
</script>

<script>
/* I18N：缺鍵自動 fallback 英文。DB 一律儲存英文 code，顯示時才翻譯。 */
/* ▼ I18N 字典（繁中＋英） → crm-data.js */
let CUR_LANG = 'zhHant';
/* 取字：缺鍵 fallback 英文，再 fallback 鍵名 */
function t(path, vars){
  const get = (o,p)=>p.split('.').reduce((a,k)=>a&&a[k], o);
  let v = get(I18N[CUR_LANG], path); if(v===undefined) v = get(I18N.en, path); if(v===undefined) v = path;
  if(vars) for(const k in vars) v = v.replace('{'+k+'}', vars[k]);
  return v;
}
/* 字典值翻譯：英文 code → 當前語言顯示 */
function td(code){ if(code===undefined||code===null||code==='') return ''; return t('dic.'+code); }
/* ▼ LANG_NAMES → crm-data.js */
</script>

<script>
/* ───────── 工具函式 ───────── */
const pad2 = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const nowStamp = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtDate = s => s ? String(s).slice(0,10) : '';
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); } // b-a
function addDays(s,n){ const d=new Date(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function debounce(fn,ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a),ms); }; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum = v => { const n = parseFloat(String(v??'').replace(/,/g,'')); return isNaN(n)?0:n; };

/* 年齡（由生日自動計算） */
function calcAge(birth){ if(!birth) return ''; const b=new Date(fmtDate(birth)), t=new Date(); if(isNaN(b)) return '';
  let a = t.getFullYear()-b.getFullYear(); const m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) a--; return a<0?'':a; }

/* 西方星座 Zodiac（自動計算；邊界法） */
/* ▼ ZOD_START / ZOD_CUT → crm-data.js */
function getZodiac(birth){ if(!birth) return ''; const d=new Date(fmtDate(birth)); if(isNaN(d)) return '';
  const m=d.getMonth(), day=d.getDate();
  return day < ZOD_CUT[m] ? ZOD_START[(m+11)%12] : ZOD_START[m]; }

/* 中國生肖（按年份計算） */
const CZODIAC = ['Monkey','Rooster','Dog','Pig','Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat'];
function getChineseZodiac(birth){ if(!birth) return ''; const y=new Date(fmtDate(birth)).getFullYear(); if(!y||isNaN(y)) return ''; return CZODIAC[y%12]; }

/* 外傭編號驗證：6–7 位純數字（不含字母） */
function isValidIdNum(v){ return /^[0-9]{6,7}$/.test(String(v||'').trim()); }
/* 護照號碼：允許含字母的真實護照格式（如 WX692824(0)），6–12 碼字母數字 */
function isValidPassport(v){ return /^[A-Z0-9()\-]{6,12}$/i.test(String(v||'').trim()); }
/* 暫用編號：9 開頭 7 位流水（無 HKID/護照的候選工人），取得真編號後刪除重建 */
function nextProvCode(){
  let max = 9000000;
  DB.helpers.forEach(h=>{ const m=/^9(\d{6})$/.exec(h.code); if(m) max=Math.max(max, 9000000 + (+m[1])); });
  return String(max+1);
}
/* Sales 標準化：對應會員 email（會員版實作於 crm-auth.js 的 stdSales） */
/* 僱主編號：EM + 西元後兩碼 + 3 位流水（超過 999 自動延長位數），取最大號 +1，刪除不重用
   註：舊版固定 3 位，逾 999 筆會產生碰撞（EM261000 重覆），故改為 \d{3,} 並檢查唯一性 */
function genEmpCode(){
  const yy = String(new Date().getFullYear()).slice(-2);
  let max = 0;
  DB.employers.forEach(e=>{
    const m = /^EM(\d{2})(\d{3,})$/.exec(e.code||'');
    if(m && m[1]===yy) max = Math.max(max, parseInt(m[2],10));
  });
  let n = max+1, code;
  do{ code = 'EM'+yy+String(n).padStart(3,'0'); n++; }
  while(DB.employers.some(e=>e.code===code));   // 防碰撞
  return code;
}

/* ───────── 資料庫：JSON 為 Single Source of Truth ───────── */
const DB_KEY='wb_crm_draft', PREF_KEY='wb_crm_prefs', UNDO_KEY='wb_crm_undo', BAK_KEY='wb_crm_backups', MAP_KEY='wb_crm_map';

let DB = null;

/* ── localStorage 草稿與偏好 ── */
/* 配額管理：Chrome localStorage 上限約 5-10MB。舊版把「整份 DB」塞入 Undo 快照（最多 20 份），
   加上 3 份自動備份，實測 716 筆外傭時已超出配額 → saveDraft() 失敗（新資料靜靜遺失）、
   savePrefs() 拋未捕捉例外（switchMod 中斷＝成個介面冇反應＝「閃退」）。
   修正：① Undo 改用「只存 helpers/employers/matchings」並以位元組預算限制份數；
         ② 所有 setItem 都有 try/catch；③ 配額爆時自動清走舊快照再試。 */
const LS_QUOTA_HINT = 4*1024*1024;   // 4MB：超過就開始清理
function lsBytes(){
  let total=0;
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); total += (localStorage.getItem(k)||'').length + (k?k.length:0); } }catch(e){}
  return total;
}
/* 配額爆時：逐步清走舊 Undo 快照 → 再清自動備份（保留最新一份） */
function lsMakeRoom(needBytes){
  try{
    const u = JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    if(Array.isArray(u) && u.length>1){ localStorage.setItem(UNDO_KEY, JSON.stringify(u.slice(-1))); }
  }catch(e){ try{ localStorage.removeItem(UNDO_KEY); }catch(e2){} }
  if(lsBytes() > LS_QUOTA_HINT){
    try{
      const b = JSON.parse(localStorage.getItem(BAK_KEY)||'[]');
      if(Array.isArray(b) && b.length>1){ localStorage.setItem(BAK_KEY, JSON.stringify(b.slice(-1))); }
    }catch(e){ try{ localStorage.removeItem(BAK_KEY); }catch(e2){} }
  }
  return lsBytes();
}
/* 安全的 localStorage 寫入：失敗時自動騰空間再試一次 */
function lsSet(key, val){
  try{ localStorage.setItem(key, val); return true; }
  catch(e){
    lsMakeRoom();
    try{ localStorage.setItem(key, val); return true; }
    catch(e2){ return false; }
  }
}
function saveDraft(){
  let json;
  try{ json = JSON.stringify(DB); }catch(e){ toast('⚠ 資料序列化失敗','error'); return false; }
  if(lsSet(DB_KEY, json)){
    if(json.length > 2*1024*1024){ // 容量警告：草稿超過 2MB
      toast(t('st.dirty')+' — JSON draft > 2MB. ' + t('imp.exportNow'), 'warn', 6000);
    }
    return true;
  }
  /* 真係寫唔入：清走 Undo 同自動備份再試最後一次 */
  try{ localStorage.removeItem(UNDO_KEY); }catch(e){}
  try{ const b=JSON.parse(localStorage.getItem(BAK_KEY)||'[]'); if(Array.isArray(b)&&b.length) localStorage.setItem(BAK_KEY, JSON.stringify(b.slice(-1))); }catch(e){ try{localStorage.removeItem(BAK_KEY);}catch(e2){} }
  if(lsSet(DB_KEY, json)) return true;
  toast('⚠ 瀏覽器儲存空間已滿，新資料未能儲存！請立即「匯出 JSON」備份。/ Storage full — export JSON now!', 'error', 12000);
  return false;
}
function loadPrefs(){
  try{ return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; }catch(e){ return {}; }
}
const PREFS = { lang:'zhHant', dark:false, mod:'data', tab:'ph', showDeparted:false, ...loadPrefs() };
/* 呢個 function 原本冇 try/catch —— 配額爆時會拋未捕捉例外，令 switchMod() 中斷、介面「凍結」 */
function savePrefs(){ lsSet(PREF_KEY, JSON.stringify(PREFS)); }

/* ── Undo（最近 20 步，Ctrl+Z） ── */
/* 只保留「會影響資料」的欄位，令每份快照細啲（舊版存全份 DB，716 筆時 20 份 ≈ 18MB → 爆配額） */
function undoSnapshot(){
  try{ return JSON.stringify({helpers:DB.helpers, employers:DB.employers, matchings:DB.matchings,
    notes:DB.notes, completedReminders:DB.completedReminders, sendLog:DB.sendLog,
    recommendations:DB.recommendations, meta:DB.meta}); }
  catch(e){ return '{}'; }
}
let undoStack = [];
function loadUndo(){ try{ undoStack = JSON.parse(localStorage.getItem(UNDO_KEY)) || []; }catch(e){ undoStack=[]; } }
function pushUndo(){
  undoStack.push(undoSnapshot());
  if(undoStack.length > 20) undoStack.shift(); // 最近 20 步
  /* 位元組預算：Undo 快照總量上限 2MB，超過就丟最舊 */
  let bytes=0; for(let i=undoStack.length-1;i>=0;i--){ bytes+=undoStack[i].length; if(bytes>2*1024*1024){ undoStack.splice(0,i+1); break; } }
  lsSet(UNDO_KEY, JSON.stringify(undoStack));
}
function doUndo(){
  if(!undoStack.length){ toast('Nothing to undo','info'); return; }
  try{
    const snap = JSON.parse(undoStack.pop());
    DB.helpers = snap.helpers||[]; DB.employers = snap.employers||[]; DB.matchings = snap.matchings||[];
    DB.notes = snap.notes||[]; DB.completedReminders = snap.completedReminders||{}; DB.sendLog = snap.sendLog||[];
    DB.recommendations = snap.recommendations||[];
    if(snap.meta) DB.meta = Object.assign(DB.meta, snap.meta);
    lsSet(UNDO_KEY, JSON.stringify(undoStack));
  }catch(e){ toast('⚠ Undo 失敗','error'); }

  saveDraft(); refreshAll(); toast('Undo ✓','info');
}
function snapshotForUndo(){ pushUndo(); }

/* ── 自動輕量備份（最近 3 份，滿額淘汰最舊） ── */
/* 每份備份都係全量資料；3 份 × 1MB ≈ 3MB，配額好緊。改為：最多 3 份但總量封頂 1.5MB。 */
function autoBackup(){
  let baks = []; try{ baks = JSON.parse(localStorage.getItem(BAK_KEY)) || []; }catch(e){}
  baks.push({ at:nowStamp(), counts:{helpers:DB.helpers.length, employers:DB.employers.length, matchings:DB.matchings.length},
    data: JSON.stringify({helpers:DB.helpers, employers:DB.employers, matchings:DB.matchings}) });
  while(baks.length > 3) baks.shift();
  /* 總位元組封頂 1.5MB：超出就丟最舊嗰份 */
  let bytes=0; for(let i=baks.length-1;i>=0;i--){ bytes+=baks[i].data.length; if(bytes>1.5*1024*1024){ baks.splice(0,i+1); break; } }
  lsSet(BAK_KEY, JSON.stringify(baks));
}

/* ── 匯出 JSON（含 schemaVersion / exportedAt / counts） ── */
function exportJSON(){
  DB.meta.lastExportedAt = nowStamp(); DB.meta.dirty = false; saveDraft();
  const out = { schemaVersion: SCHEMA_VERSION, exportedAt: nowStamp(),
    counts:{ helpers:DB.helpers.length, employers:DB.employers.length, matchings:DB.matchings.length, notes:DB.notes.length },
    photos: photoAll(),
    data: DB };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date(); const stamp = `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  a.href = URL.createObjectURL(blob); a.download = `crm-backup-${stamp}.json`; a.click();
  URL.revokeObjectURL(a.href);
  autoBackup(); renderStatusBar(); toast(t('form.saved')+' ✓','ok');
}

/* ── 上載還原（完全取代 + 比對摘要 + 二次確認 + Undo 快照） ── */
function restoreJSON(file){
  const r = new FileReader();
  r.onload = () => {
    let obj; try{ obj = JSON.parse(r.result); }catch(e){ toast('Invalid JSON','error'); return; }
    const inc = obj.data || obj;
    if(!inc.helpers || !inc.employers){ toast('Invalid backup structure','error'); return; }
    const cmp = { cur:{h:DB.helpers.length,e:DB.employers.length,m:DB.matchings.length},
      inc:{h:(inc.helpers||[]).length, e:(inc.employers||[]).length, m:(inc.matchings||[]).length} };
    openConfirm(t('imp.compare'),
      `<div class="text-sm space-y-1">
        <div class="flex justify-between"><span>${t('imp.cur')}</span><b>${cmp.cur.h} FDH / ${cmp.cur.e} EMP / ${cmp.cur.m} MT</b></div>
        <div class="flex justify-between"><span>${t('imp.incoming')}</span><b class="text-green-600">${cmp.inc.h} FDH / ${cmp.inc.e} EMP / ${cmp.inc.m} MT</b></div>
        <div class="mt-2 p-2 rounded bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 font-semibold">⚠ ${t('imp.restoreWarn')} ${t('imp.confirmRestore')}</div>
      </div>`,
      ()=>{ pushUndo();
        DB = Object.assign(emptyDB(), inc);
        DB.meta = Object.assign({companyName:'Ka Shing Manpower agency'}, inc.meta||{});
        photoRestoreAll(obj.photos);
        DB.meta.dirty = false; if(!DB.holidays || !Object.keys(DB.holidays).length) DB.holidays = builtinHolidays();
        saveDraft(); refreshAll(); autoBackup(); toast(t('form.saved')+' ✓','ok');
      });
  };
  r.readAsText(file, 'UTF-8');
}

function markChange(){

/* ── Toast ── */
function toast(msg, type='info', ms=3000){
  const colors = { ok:'bg-green-600', error:'bg-red-600', warn:'bg-orange-500', info:'bg-slate-700' };
  const el = document.createElement('div');
  el.className = `${colors[type]||colors.info} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg max-w-sm break-words`;
  el.textContent = msg; document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), ms);
}

/* ── 通用彈窗：openModal(title, bodyHTML, onOk, opts) ── */
function openModal(title, bodyHTML, onOk, opts={}){
  const root = document.getElementById('modalRoot');
  const okBtn = onOk ? `<button id="modalOk" class="btn ${opts.okClass||'btn-pri'}">${opts.okText||t('btn.confirm')}</button>` : '';
  root.innerHTML = `<div class="modal-mask" id="modalMask">
    <div class="card w-full max-w-3xl my-4" style="max-height:92vh; display:flex; flex-direction:column">
      <div class="flex items-center justify-between px-5 py-3 border-b bd shrink-0">
        <h3 class="font-bold">${title}</h3>
        <button id="modalClose" class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="px-5 py-4 overflow-y-auto" id="modalBody">${bodyHTML}</div>
      ${onOk?`<div class="px-5 py-3 border-t bd flex justify-end gap-2 shrink-0">
        <button id="modalCancel" class="btn btn-sec">${t('btn.cancel')}</button>${okBtn}</div>`:''}
    </div></div>`;
  refreshIcons();
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modalClose').onclick = close;
  const mc = document.getElementById('modalMask');
  if(!opts.lockBg) mc.addEventListener('click', e=>{ if(e.target===mc) close(); });
  if(onOk) document.getElementById('modalOk').onclick = ()=>{ if(onOk()!==false) close(); };
  if(document.getElementById('modalCancel')) document.getElementById('modalCancel').onclick = close;
  return { close, body: document.getElementById('modalBody') };
}
function openConfirm(title, html, onOk){ openModal(title, html, onOk, {okClass:'btn-red', okText:t('btn.confirm'), lockBg:true}); }

function refreshIcons(){ try{ if(window.lucide && window.lucide.createIcons) window.lucide.createIcons(); else if(window.__lucideFallback) window.__lucideFallback(); }catch(e){ if(window.__lucideFallback) try{window.__lucideFallback();}catch(e2){} } }
</script>

<script>

function renderHolidayBanner(){
  const T = todayStr(); let hit = null;

  for(const h of all){ const d = daysBetween(T, h.date); if(d>=0 && d<=7){ hit = h; break; } }

/* ───────── 分頁 + 排序 + 搜尋 通用工具 ───────── */
function paginate(arr, st){
  if(st.sort){ arr = [...arr].sort((a,b)=>{ let x=a[st.sort],y=b[st.sort]; if(x==null)x=''; if(y==null)y='';
    if(typeof x==='number'&&typeof y==='number') return (x-y)*st.dir; return String(x).localeCompare(String(y))*st.dir; }); }
  const pages = Math.max(1, Math.ceil(arr.length/PAGE_SIZE));
  st.page = Math.min(st.page, pages);
  return { rows: arr.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE), pages, total: arr.length };
}
function pagerHTML(st, pages, total, fn){
  let btns = '';
  for(let p=1;p<=pages;p++){ if(pages>7 && p>2 && p<pages-1 && Math.abs(p-st.page)>1){ if(p===3) btns+=`<span class="px-1 muted">…</span>`; continue; }
    btns += `<button class="px-2.5 py-1 rounded ${p===st.page?'bg-indigo-600 text-white':'btn-sec'}" data-p="${p}">${p}</button>`; }
  return `<div class="flex items-center gap-2 flex-wrap mt-3 text-sm">
    <span class="muted">${total} rows</span>
    <button class="btn btn-sec !min-h-[32px] !py-1 !px-2" data-pg="prev" ${st.page<=1?'disabled':''}>‹</button>${btns}
    <button class="btn btn-sec !min-h-[32px] !py-1 !px-2" data-pg="next" ${st.page>=pages?'disabled':''}>›</button></div>`;
}
function bindPager(container, st, rerender){
  container.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ st.page=+b.dataset.p; rerender(); });
  container.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{ st.page += b.dataset.pg==='prev'?-1:1; rerender(); });
}

/* ───────── 外傭搜尋（涵蓋編號、英文名、暱稱、HKID/護照）＋篩選 ─────────
   鐵律：黑名單（BLACKLIST）工人一律自動隱藏，只在「黑名單」專頁顯示 */
function filterHelpers(nat, st){
  const q = st.search.trim().toLowerCase();
  return DB.helpers.filter(h=>{
    if(h.nationality!==nat) return false;
    if(h.workerClass==='BLACKLIST') return false; // 黑名單自動隱藏
    if(st.fStatus && h.contract!==st.fStatus) return false;
    if(st.fWClass && h.workerClass!==st.fWClass) return false;
    if(st.fSkill && !(h.skills||[]).includes(st.fSkill)) return false;
    if(st.fZodiac && getZodiac(h.birth)!==st.fZodiac) return false;      // 西方星座
    if(st.fCzodiac && getChineseZodiac(h.birth)!==st.fCzodiac) return false; // 中國生肖
    if(st.fBest && h.bestInterest!==st.fBest) return false;                // 最擅長工作意向
    if(!q) return true;
    return [h.code,h.engName,h.nickname,h.hkid,h.passport,h.refNo,h.extCode,h.phoneHK,h.phoneIndo,h.phonePH,h.email].some(v=>String(v||'').toLowerCase().includes(q));
  });
}

function th(key,labelKey,st){ return `<th data-sort="${key}">${t(labelKey)}${st.sort===key?(st.dir>0?' ▲':' ▼'):''}</th>`; }

function batchDelete(ids, coll, done){
  if(!ids.length) return;
  /* MEMBER 只可刪自己經手嘅記錄 */
  let allowed = ids;
  if(!isAdmin() && typeof canDeleteRecord==='function'){
    const src = coll==='helpers' ? DB.helpers : DB.employers;
    allowed = ids.filter(id=>{ const rec = src.find(x=>x.code===id); return rec && canDeleteRecord(rec); });
    const blocked = ids.filter(id=>!allowed.includes(id));
    if(blocked.length){
      alert(CUR_LANG==='zhHant'
        ? ('以下記錄不是你經手，無法刪除：\n'+blocked.join(', '))
        : ('You can only delete records you own://n'+blocked.join(', ')));
      if(!allowed.length) return;
    }
  }

}

/* ═════════ 外傭表單（新增/編輯） ═════════ */
/* ═════════ 候選人問卷自動匯入（#cand=base64） ═════════ */
/* 問卷題目值 → CRM 代碼 對照（依用戶 2026-10-29 確認） */
/* ▼ CAND_* 問卷值對照 → crm-data.js */

/* 解碼問卷匯入碼（base64 → JSON） */
function decodeCandCode(code){
  try{ return JSON.parse(decodeURIComponent(escape(atob(String(code).trim())))); }
  catch(e){ return null; }
}
/* 讀取網址 #cand= 自動匯入碼 */
function readCandidateHash(){
  try{ const m = location.hash.match(/cand=([^&]+)/); if(!m) return null; return decodeCandCode(decodeURIComponent(m[1])); }
  catch(e){ return null; }
}
/* 問卷 payload → CRM 外傭物件，並開啟預填表單 */
function importPendingCandidate(p){
  if(!p || !p.fields) return;
  const f = p.fields;
  const nat = CAND_NAT[f.nationality] || 'PH';
  const h = {
    code:'', refNo:'', extCode:'', engName:f.fullName||'', nickname:f.nickname||'', nationality:nat, birth:f.dob||'',
    marital: CAND_MARITAL[f.maritalStatus]||'SINGLE', children: toNum(f.childrenCount)||0, education: CAND_EDU[f.educationLevel]||'',
    langEn: CAND_LANG[f.lang_english]||'', langCt: CAND_LANG[f.lang_cantonese]||'', langPtn: CAND_LANG[f.lang_mandarin]||'',
    skills: (f.skills||[]).map(function(s){ return CAND_SKILL[s]; }).filter(Boolean),
    expYears: toNum(f.yearsExp)||0, contract:'FIND_JOB', workerClass:'GOOD', classReason:'', classAt:'',
    hkid:'', passport:'', contractExpiry:'', notes: f.remarks||'',
    phoneHK: f.hkWhatsapp||'', phoneIndo: f.indoWhatsapp||'', phonePH: f.phWhatsapp||'', email: f.email||'', facebook: f.facebook||'',
    bestInterest: CAND_BI[f.bestInterest]||'', expSummary: f.workExperience||'',
    contractDone: toNum(f.contractsCompleted)||0,
    religion: f.religion||'', height: toNum(f.height)||0, weight: toNum(f.weight)||0
  };
  /* HKID / Passport：問卷已分開兩欄，直接取用；舊匯入碼（合併值）回退自動判斷 */
  const hk = (f.hkid||'').trim();
  const pp = (f.passport||'').trim();
  if(hk){
    h.hkid = hk;
    if(pp) h.passport = pp;
  } else if(pp){
    if(/^\d{6,7}$/.test(pp)) h.hkid = pp; else h.passport = pp;
  }
  /* 相片：問卷用 localStorage key 傳遞（匯入碼唔會膨脹） */
  if(f.photoKey){
    try{ var pu=localStorage.getItem('ddhc_cand_photo_'+f.photoKey); if(pu) h.__photo=pu; }catch(e){}
  }
  openFdhForm(h, nat);
  toast('✓ ' + t('cand.imported') + ' — ' + t('cand.reviewSave'), 'ok', 6000);
}
/* 開機 / 登入後自動檢查匯入碼 */
function checkCandidateHash(){
  const p = readCandidateHash();
  if(p){
    importPendingCandidate(p);
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
  }
}
/* ── 僱主問卷匯入（#emp=base64）── */
function readEmployerHash(){
  try{ const m = location.hash.match(/emp=([^&]+)/); if(!m) return null; return decodeCandCode(decodeURIComponent(m[1])); }
  catch(e){ return null; }
}
function importPendingEmployer(p){
  if(!p || !p.fields) return;
  const f = p.fields;
  const nm = String(f.employerName||'').trim();
  const hasCJK = /[\u3400-\u9fff]/.test(nm);
  /* 家庭組成 → family 文字摘要（表單本身有 fm*Count / fm*Note 獨立欄位） */
  const famMap = [['Adult','cntAdult','descAdult'],['Infant','cntInfant','descInfant'],
                  ['Children','cntChildren','descChildren'],['Elderly','cntElderly','descElderly'],
                  ['Disabled','cntDisabled','descDisabled']];
  const famParts = [];
  famMap.forEach(function(m){
    const cnt = toNum(f[m[1]]);
    if(cnt) famParts.push(cnt+' '+t('emp.fm'+m[0]) + (f[m[2]] ? ' ('+f[m[2]]+')' : ''));
  });
  const notes = [];
  if((f.preferredApp||[]).length) notes.push('Contact via: ' + f.preferredApp.join(' / '));
  if(String(f.notes||'').trim()) notes.push(String(f.notes).trim());
  const obj = {
    code: genEmpCode(), salutation: nm || f.salutation || '', title:'', erNameZh: hasCJK ? nm : '',
    nickname: f.nickname||'', phone: f.phone||'', whatsapp: f.whatsapp||'', email: f.email||'',
    district: EMP_VAL_AREA[f.area] || f.area || '', expectedStartDate: f.startDate||'',
    refCode:'', refCodeOld:'', family: famParts.join(' / '),
    fmAdultCount: toNum(f.cntAdult), fmAdultNote: f.descAdult||'',
    fmInfantCount: toNum(f.cntInfant), fmInfantNote: f.descInfant||'',
    fmChildrenCount: toNum(f.cntChildren), fmChildrenNote: f.descChildren||'',
    fmElderlyCount: toNum(f.cntElderly), fmElderlyNote: f.descElderly||'',
    fmDisabledCount: toNum(f.cntDisabled), fmDisabledNote: f.descDisabled||'',
    flatSize: toNum(f.flatSize), bedrooms: toNum(f.bedrooms),
    maidRoom: EMP_VAL_MROOM[f.maidRoom] || '', offDay: EMP_VAL_OFFDAY[f.offDay] || '',
    homeMembers: (f.homeMembers||[]).map(function(v){ return EMP_VAL_HOME[v]; }).filter(Boolean),
    jobDuties: (f.duties||[]).map(function(v){ return EMP_VAL_DUTY[v]; }).filter(Boolean),
    maritalPref: (f.maritalPref||[]).map(function(v){ return EMP_VAL_MPREF[v]; }).filter(Boolean),
    appTypes: (f.appType||[]).map(function(v){ return EMP_VAL_APP[v]; }).filter(Boolean),
    needs: (f.needsTags||[]).map(function(v){ return EMP_VAL_NEED[v]; }).filter(Boolean),
    acceptedNat: (f.nationality||[]).map(function(v){ return EMP_VAL_NAT[v]; }).filter(Boolean),
    expectDate:'', source: EMP_VAL_SOURCE[f.source] || f.source || '', level:'NEW',
    sales:'', stage:'FINDING', lastContact:'', followUp:'', notes: notes.join('\n')
  };
  openEmpForm(obj, true);
  toast('\u2713 ' + t('empImport.imported') + ' \u2014 ' + t('empImport.reviewSave'), 'ok', 6000);
}
function checkEmployerHash(){
  const p = readEmployerHash();
  if(p){
    importPendingEmployer(p);
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
  }
}
/* 登入後／開機：按 hash 分派 cand 或 emp */
function checkImportHash(){
  const h = location.hash || '';
  if(/cand=/.test(h)){ checkCandidateHash(); return; }
  if(/emp=/.test(h)){ checkEmployerHash(); return; }
}

  const code = window.prompt(t('empImport.pasteCode'));

/* ── 相片：壓縮 + 獨立 localStorage 儲存 ───────────────────────────
   相片唔放落草稿 DB（免佔 4MB 配額），每個工人一條獨立 key：
     wb_crm_photo_<code>  →  壓縮後的 data URL
   匯出 JSON 時會合併入 photos 欄，備份唔會漏相。                      */
const PHOTO_W=330, PHOTO_H=440, PHOTO_Q=0.72, PHOTO_MAX_BYTES=28*1024;
const PHOTO_PREFIX='wb_crm_photo_';
function photoBytes(durl){ return Math.round(String(durl||'').length*0.75); }
function photoLoadViaImg(file){
  return new Promise(function(res, rej){
    var fr=new FileReader();
    fr.onload=function(e){ var im=new Image();
      im.onload=function(){ res({src:im, w:im.naturalWidth||im.width, h:im.naturalHeight||im.height, close:function(){}}); };
      im.onerror=function(){ rej(new Error('decode')); };
      im.src=e.target.result; };
    fr.onerror=function(){ rej(new Error('read')); };
    fr.readAsDataURL(file);
  });
}
function photoLoadImage(file){
  return new Promise(function(res, rej){
    if(window.createImageBitmap){
      createImageBitmap(file,{imageOrientation:'from-image'}).then(
        function(bm){ res({src:bm, w:bm.width, h:bm.height, close:function(){ try{bm.close();}catch(e){} }}); },
        function(){ photoLoadViaImg(file).then(res, rej); });
    } else { photoLoadViaImg(file).then(res, rej); }
  });
}
function photoCompress(file){
  return photoLoadImage(file).then(function(im){
    var w=im.w, h=im.h;
    if(!w || !h) throw new Error('bad size');
    var s=Math.max(PHOTO_W/w, PHOTO_H/h);
    var cw=Math.min(w, PHOTO_W/s), ch=Math.min(h, PHOTO_H/s);
    var sx=Math.max(0,(w-cw)/2), sy=Math.max(0,(h-ch)*0.40);
    var cv=document.createElement('canvas'); cv.width=PHOTO_W; cv.height=PHOTO_H;
    var cx=cv.getContext('2d');
    cx.fillStyle='#fff'; cx.fillRect(0,0,PHOTO_W,PHOTO_H);
    cx.drawImage(im.src, sx, sy, cw, ch, 0, 0, PHOTO_W, PHOTO_H);
    im.close();
    var q=PHOTO_Q, url=cv.toDataURL('image/jpeg', q);
    while(q>0.45 && photoBytes(url)>PHOTO_MAX_BYTES){ q-=0.08; url=cv.toDataURL('image/jpeg', q); }
    if(!url || url.indexOf('data:image/jpeg')!==0) throw new Error('encode');
    return url;
  });
}
function photoGet(code){ if(!code) return ''; try{ return localStorage.getItem(PHOTO_PREFIX+code)||''; }catch(e){ return ''; } }
function photoSet(code, durl){
  if(!code || !durl) return;
  try{ localStorage.setItem(PHOTO_PREFIX+code, durl); }
  catch(e){ try{ toast('⚠ '+t('fdh.photo')+' — storage quota exceeded','warn'); }catch(e2){} }
}
function photoDel(code){ if(!code) return; try{ localStorage.removeItem(PHOTO_PREFIX+code); }catch(e){} }
function photoAll(){
  var out={};
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k && k.indexOf(PHOTO_PREFIX)===0) out[k.slice(PHOTO_PREFIX.length)]=localStorage.getItem(k); } }catch(e){}
  return out;
}
function photoRestoreAll(map){
  if(!map) return;
  try{ var keep={};
    for(var code in map){ if(map[code]){ localStorage.setItem(PHOTO_PREFIX+code, map[code]); keep[code]=1; } }
    for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i);
      if(k && k.indexOf(PHOTO_PREFIX)===0 && !keep[k.slice(PHOTO_PREFIX.length)]) localStorage.removeItem(k); }
  }catch(e){}
}
function photoThumb(code, cls){
  var p=photoGet(code);
  if(!p) return '<div class="'+cls+' rounded border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800"></div>';
  return '<img src="'+p+'" class="'+cls+' rounded border border-slate-200 dark:border-slate-700 object-cover" alt="">';
}

    if(st.stage && e.stage!==st.stage) return false; // 按目前階段篩選
    if(st.sales && e.sales!==st.sales) return false; // 按 Sales 同事篩選

  refreshIcons();
  let deb = debounce(v=>{ st.search=v; st.page=1; renderEmployerTable(); },300);
  document.getElementById('empSearch').oninput = e=>deb(e.target.value);
  document.getElementById('empStage').onchange = e=>{ st.stage=e.target.value; st.page=1; renderEmployerTable(); };
  document.getElementById('empLevel').onchange = e=>{ st.filter=e.target.value; st.page=1; PREFS.empFilter=st.filter; savePrefs(); renderEmployerTable(); };
  document.getElementById('empSales').onchange = e=>{ st.sales=e.target.value; st.page=1; PREFS.empSales=st.sales; savePrefs(); renderEmployerTable(); };
  document.getElementById('empDistrict').onchange = e=>{ st.district=e.target.value; st.page=1; renderEmployerTable(); };
  document.getElementById('empAppType').onchange = e=>{ st.appType=e.target.value; st.page=1; renderEmployerTable(); };
  document.getElementById('empMaritalPref').onchange = e=>{ st.maritalPref=e.target.value; st.page=1; renderEmployerTable(); };
  document.getElementById('btnMyEmp').onclick = ()=>{ st.sales = st.sales===SESSION.email ? '' : SESSION.email; PREFS.empSales=st.sales; savePrefs(); renderEmployerTable(); };
  document.getElementById('btnAddEmp').onclick = ()=>openEmpForm(null);
  document.getElementById('btnImportEmp').onclick = openEmpImport;
  document.getElementById('ckAllE').onchange = e=>{ rows.forEach(x=> e.target.checked?st.checked.add(x.code):st.checked.delete(x.code)); renderEmployerTable(); };
  body.querySelectorAll('.ckRow').forEach(c=>c.onchange=e=>{ e.target.checked?st.checked.add(c.dataset.id):st.checked.delete(c.dataset.id); renderEmployerTable(); });
  body.querySelectorAll('table th[data-sort]').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(st.sort===k) st.dir*=-1; else {st.sort=k; st.dir=1;} renderEmployerTable(); });
  bindPager(body, st, renderEmployerTable);
  document.getElementById('btnDelEmp').onclick = ()=>batchDelete([...st.checked],'employers',()=>{ st.checked.clear(); renderEmployerTable(); });
  /* WhatsApp：同外傭邏輯 — 跳去客服知識庫 + 純文字對話框 → wa.me 發送 */
  body.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{ const e=DB.employers.find(x=>x.code===b.dataset.wa); if(e) openEmpWADialog(e); });
  body.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const e = DB.employers.find(x=>x.code===b.dataset.id);
    if(b.dataset.act==='edit') openEmpForm(e);
    else if(b.dataset.act==='detail') openEmpDetail(e);
    else if(b.dataset.act==='del') openConfirm(t('btn.del'), `<p class="text-sm">${t('form.delConfirm')}</p><p class="font-bold mt-2">${esc(e.salutation)} (${esc(e.code)})</p>`,
      ()=>{ pushUndo(); DB.employers = DB.employers.filter(x=>x.code!==e.code); markChange(); toast(t('form.saved'),'ok'); renderEmployerTable(); });
  });
}

    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.needs')}</label><div class="flex flex-wrap gap-1.5 mt-1" id="needWrap">${needChips}</div></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.acceptedNat')}</label><div class="flex flex-wrap gap-1.5 mt-1" id="natWrap">${natChips}</div></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.jobDuties')}</label><div class="flex flex-wrap gap-1.5 mt-1" id="dutyWrap">${dutyChips}</div></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.maritalPref')}</label><div class="flex flex-wrap gap-1.5 mt-1" id="maritalPrefWrap">${mpChips}</div></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.appTypes')}</label><div class="flex flex-wrap gap-1.5 mt-1" id="appTypeWrap">${appChips}</div></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.followUp')}</label><textarea class="inp" rows="2" data-f="followUp">${esc(e.followUp||'')}</textarea></div>
    <div class="md:col-span-3"><label class="text-xs muted">${t('emp.notes')}</label><textarea class="inp" rows="2" data-f="notes">${esc(e.notes)}</textarea></div>
  </div>`,
  ()=>{ const body = document.getElementById('modalBody');

    if(!get('salutation')){ alert(t('emp.salutation')+' '+t('form.required')); return false; }
    const newCode = String(get('code')||'').trim();
    if(!newCode){ alert(t('emp.code')+' '+t('form.required')); return false; }
    if(newCode !== oldCode){
      if(DB.employers.some(x=>x.code===newCode)){ alert(t('form.dupId')+' — '+newCode); return false; }
    }
    pushUndo();
    const obj = {...e, code:newCode};
    ['salutation','erNameZh','nickname','phone','whatsapp','family','expectDate','notes','refCode','refCodeOld','source','followUp',
     'title','district','email','expectedStartDate','maidRoom','offDay',
     'fmAdultCount','fmAdultNote','fmInfantCount','fmInfantNote','fmChildrenCount','fmChildrenNote',
     'fmElderlyCount','fmElderlyNote','fmDisabledCount','fmDisabledNote'].forEach(k=>obj[k]=get(k));
    obj.sales=get('sales'); obj.stage=get('stage'); obj.lastContact=fmtDate(get('lastContact'));
    obj.level=get('level');
    obj.flatSize=toNum(get('flatSize')); obj.bedrooms=toNum(get('bedrooms'));
    FM_KEYS.forEach(([k])=>{ obj['fm'+k+'Count']=toNum(get('fm'+k+'Count')); });
    obj.needs=[...body.querySelectorAll('#needWrap .chip.on')].map(c=>c.dataset.skill);
    obj.acceptedNat=[...body.querySelectorAll('#natWrap .chip.on')].map(c=>c.dataset.nat);
    obj.homeMembers=[...body.querySelectorAll('#homeMemWrap .chip.on')].map(c=>c.dataset.member);
    obj.jobDuties=[...body.querySelectorAll('#dutyWrap .chip.on')].map(c=>c.dataset.duty);
    obj.maritalPref=[...body.querySelectorAll('#maritalPrefWrap .chip.on')].map(c=>c.dataset.pref);
    obj.appTypes=[...body.querySelectorAll('#appTypeWrap .chip.on')].map(c=>c.dataset.app);
    /* 擁有權：新建時記錄經手會員；修改時保留原擁有者 */
    if(isNew) obj.ownerEmail = (typeof newOwnerEmail==='function') ? newOwnerEmail() : '';
    else { const orig = DB.employers.find(x=>x.code===oldCode); obj.ownerEmail = orig && orig.ownerEmail ? orig.ownerEmail : (obj.ownerEmail||''); }
    if(isNew) DB.employers.push(obj); else { const i=DB.employers.findIndex(x=>x.code===oldCode); if(i>=0) DB.employers[i]=obj; }
    /* 僱主編號改變 → 同步 Job Order / 發送紀錄 */
    if(newCode!==oldCode){
      DB.matchings.forEach(m=>{ if(m.empCode===oldCode) m.empCode=newCode; });
      DB.sendLog.forEach(l=>{ if(l.empCode===oldCode) l.empCode=newCode; });
    }
    markChange(); toast(t('form.saved')+' ✓','ok'); renderDataModule();
  });
  document.getElementById('modalBody').querySelectorAll('#needWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('modalBody').querySelectorAll('#natWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('modalBody').querySelectorAll('#homeMemWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('modalBody').querySelectorAll('#dutyWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('modalBody').querySelectorAll('#maritalPrefWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('modalBody').querySelectorAll('#appTypeWrap .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
}
</script>

<!-- ══════════ Script 7：模組二 —— 智能配對引擎（加權評分 + 硬性篩選） ══════════ -->
<script>
/* ───────── 等級對照（用於「最低要求」篩選比較） ───────── */
/* ▼ EDU_RANK / LANG_RANK / MATCH_CONDS → crm-data.js */

/* ───────── 配對狀態（UI 層；篩選條件全部集中喺度，方便日後擴充） ───────── */
const MATCH_STATE = {
  conds:[], empCode:'',
  nat:'', ageMin:'', ageMax:'', expMin:'',
  edu:'', visaDays:'', zodiac:'', czodiac:'', marital:'', children:'',
  langEn:'', langCt:'', langPtn:'',
  contractDone:'',
  includeExpiring:true, expiringDays:String(EXPIRING_DEFAULT_DAYS),
  run:false
};
/* 候選名單（持久化到 localStorage，重新開檔唔會唔見） */
const CAND_KEY = 'wb_crm_cands';
function loadCands(){ try{ const c=JSON.parse(localStorage.getItem(CAND_KEY)); return Array.isArray(c)?c:[]; }catch(e){ return []; } }
function saveCands(){ lsSet(CAND_KEY, JSON.stringify(window.MATCH_CANDS||[])); }

/* ───────── 引擎介面 ───────── */
function renderMatchEngine(){
  const el = document.getElementById('matchBody');
  const S = MATCH_STATE;
  const all = t('follow.all');

        ${curEmp.stage?`<span class="badge b-blue">${td(curEmp.stage)}</span>`:''}
        <button class="btn btn-sec !min-h-[30px] !py-1 !px-2 text-xs ml-auto" id="btnApplyEmp"><i data-lucide="wand-2" class="w-3.5 h-3.5"></i>${t('match.applyEmp')}</button>
      </div>
      <div class="text-xs muted mt-1">${t('emp.needs')}: ${(curEmp.needs||[]).map(td).join('、')||'—'}</div>
      <div class="text-xs muted">${t('emp.acceptedNat')}: ${(curEmp.acceptedNat||[]).map(td).join('、')||'—'}</div>
      ${curEmp.notes?`<div class="text-xs muted">${t('fdh.notes')}: ${esc(curEmp.notes)}</div>`:''}
    </div>` : '';

  const skillChips = SKILLS.map(s=>`<label class="chip ${S.conds.includes('SK:'+s)?'on':''}" data-cond="SK:${s}">${td(s)}</label>`).join('');
  const langChips  = MATCH_CONDS.filter(c=>c.k.indexOf('LANG_')===0)
    .map(c=>`<label class="chip ${S.conds.includes(c.k)?'on':''}" data-cond="${c.k}">${t(c.labelKey)}</label>`).join('');
  const biChips    = BEST_INTERESTS.map(b=>`<label class="chip ${S.conds.includes('BI:'+b)?'on':''}" data-cond="BI:${b}">${td(b)}</label>`).join('');

  el.innerHTML = `
  <div class="card p-4 mb-4">
    <h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="git-compare-arrows" class="w-5 h-5 text-indigo-600"></i>${t('match.title')}</h3>

    <!-- 僱主 -->
    <div class="mb-3">
      <label class="text-xs muted">${t('match.emp')}</label>
      <select id="mEmp" class="inp">${empOpts}</select>
      ${empInfo}
    </div>

    <!-- 加權評分條件 -->
    <div class="mb-3">
      <label class="text-xs muted">${t('match.conds')}</label>
      <div class="text-[11px] muted mt-1 mb-1 font-semibold">${t('match.skills')}</div>
      <div class="flex flex-wrap gap-1.5" id="condWrap">${skillChips}</div>
      <div class="text-[11px] muted mt-2 mb-1 font-semibold">${t('match.langs')}</div>
      <div class="flex flex-wrap gap-1.5" id="condWrapLang">${langChips}</div>
      <div class="text-[11px] muted mt-2 mb-1 font-semibold">${t('fdh.bestInterest')}</div>
      <div class="flex flex-wrap gap-1.5" id="condWrapBI">${biChips}</div>
    </div>

    <!-- 硬性篩選 -->
    <div class="mb-2 text-[11px] muted font-semibold">${t('match.hardFilters')}</div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
      ${sel('mNat', t('match.nat'), o('',all,'')+['PH','ID','OTHER'].map(n=>o(n,td(n),S.nat)).join(''), S.nat)}
      ${sel('mEdu', t('match.edu'), o('',all,'')+['ELEMENTARY','HIGH_SCHOOL','VOCATIONAL','COLLEGE','UNIVERSITY','OTHER'].map(n=>o(n,td(n),S.edu)).join(''), S.edu)}
      ${sel('mZodiac', t('match.zodiac'), o('',all,'')+ZOD_START.map(z=>o(z,z,S.zodiac)).join(''), S.zodiac)}
      ${sel('mCzodiac', t('match.czodiac'), o('',all,'')+CZODIAC.map(z=>o(z,z,S.czodiac)).join(''), S.czodiac)}
      ${sel('mMarital', t('match.marital'), o('',all,'')+MARITALS.map(x=>o(x,td(x),S.marital)).join(''), S.marital)}
      ${sel('mChildren', t('match.children'), o('',all,'')+o('YES',t('match.childYes'),S.children)+o('NO',t('match.childNo'),S.children), S.children)}
      ${sel('mLangEn', t('match.langEn'), o('',all,'')+['GOOD','FAIR'].map(x=>o(x,td(x),S.langEn)).join(''), S.langEn)}
      ${sel('mLangCt', t('match.langCt'), o('',all,'')+['GOOD','FAIR'].map(x=>o(x,td(x),S.langCt)).join(''), S.langCt)}
      ${sel('mLangPtn', t('match.langPtn'), o('',all,'')+['GOOD','FAIR'].map(x=>o(x,td(x),S.langPtn)).join(''), S.langPtn)}
      ${num('mAgeMin', t('match.ageMin'), S.ageMin)}
      ${num('mAgeMax', t('match.ageMax'), S.ageMax)}
      ${num('mExpMin', t('match.expMin'), S.expMin)}
      ${num('mContractDone', t('match.contractDone'), S.contractDone, '1')}
    </div>

    <!-- 「有工做」+ Visa 到期 規則 -->
    <div class="mt-3 rounded-lg border ${S.includeExpiring?'border-orange-400 dark:border-orange-600':'bd'} bg-orange-50 dark:bg-orange-900/25 p-3">

        <input type="checkbox" id="mIncludeExpiring" ${S.includeExpiring?'checked':''}>
        ${t('match.includeExpiring')}
        <input type="number" id="mExpiringDays" class="inp !w-20 !py-1 ml-1" value="${esc(S.expiringDays)}">
        <span class="text-xs muted">${t('match.expiringDays')}</span>
      </label>

  const applyBtn = document.getElementById('btnApplyEmp');
  if(applyBtn) applyBtn.onclick = ()=>{

    /* 需求標籤 → 評分條件（去重） */
    (emp.needs||[]).forEach(n=>{ const k='SK:'+n; if(!S.conds.includes(k)) S.conds.push(k); });
    /* 可接受國籍：只有一個就直接套用 */
    if((emp.acceptedNat||[]).length===1) S.nat = emp.acceptedNat[0];
    renderMatchEngine();
    toast(t('match.applied')+' ✓','ok');
  };
  /* 硬性篩選：改動即寫入狀態（如已配對過就即時重跑） */
  const bindSel = (id,key)=>{ const c=document.getElementById(id); if(!c) return;
    c.onchange = e=>{ S[key]=e.target.value; if(S.run) runMatching(); }; };
  const bindNum = (id,key)=>{ const c=document.getElementById(id); if(!c) return;
    c.onchange = e=>{ S[key]=e.target.value; if(S.run) runMatching(); }; };
  bindSel('mNat','nat'); bindSel('mEdu','edu'); bindSel('mZodiac','zodiac'); bindSel('mCzodiac','czodiac');
  bindSel('mMarital','marital'); bindSel('mChildren','children');
  bindSel('mLangEn','langEn'); bindSel('mLangCt','langCt'); bindSel('mLangPtn','langPtn');
  bindNum('mAgeMin','ageMin'); bindNum('mAgeMax','ageMax'); bindNum('mExpMin','expMin');
  bindNum('mContractDone','contractDone');
  const inc = document.getElementById('mIncludeExpiring');
  inc.onchange = e=>{ S.includeExpiring=e.target.checked; renderMatchEngine(); if(S.run) runMatching(); };
  document.getElementById('mExpiringDays').onchange = e=>{ S.expiringDays=e.target.value; if(S.run) runMatching(); };

  document.getElementById('btnRunMatch').onclick = ()=>{
    S.empCode = document.getElementById('mEmp').value;
    S.run = true; runMatching();
  };
  renderCands();
  if(S.run) runMatching();
}

/* ───────── 配對運算 ───────── */
function runMatching(){
  const S = MATCH_STATE, T = todayStr();
  const thr = toNum(S.expiringDays) || EXPIRING_DEFAULT_DAYS;
  const conds = MATCH_CONDS.filter(c=>S.conds.includes(c.k));

  /* 硬性篩選：逐項排除唔符合條件嘅工人 */
  const pool = DB.helpers.filter(h=>{
    if(h.workerClass==='BLACKLIST') return false;      // 黑名單一律唔參與
    if(h.contract==='NOT_FINDING') return false;       // 唔搵工 → 唔參與
    if(S.nat && h.nationality!==S.nat) return false;
    const age = calcAge(h.birth);
    if(S.ageMin && (age==='' || age < +S.ageMin)) return false;
    if(S.ageMax && (age==='' || age > +S.ageMax)) return false;
    if(S.expMin && (h.expYears||0) < +S.expMin) return false;
    if(S.edu && (EDU_RANK[h.education]||0) < (EDU_RANK[S.edu]||0)) return false;
    if(S.zodiac && getZodiac(h.birth)!==S.zodiac) return false;
    if(S.czodiac && getChineseZodiac(h.birth)!==S.czodiac) return false;
    if(S.marital && h.marital!==S.marital) return false;
    const kids = toNum(h.children);
    if(S.children==='YES' && !(kids>0)) return false;
    if(S.children==='NO'  &&  (kids>0)) return false;
    if(S.langEn  && (LANG_RANK[h.langEn]||0)  < (LANG_RANK[S.langEn]||0))  return false;
    if(S.langCt  && (LANG_RANK[h.langCt]||0)  < (LANG_RANK[S.langCt]||0))  return false;
    if(S.langPtn && (LANG_RANK[h.langPtn]||0) < (LANG_RANK[S.langPtn]||0)) return false;
    if(S.contractDone && (h.contractDone||0) < +S.contractDone) return false;
    return true;
  });

  /* 加權評分 */
  let scored = pool.map(h=>{
    const checks = conds.map(c=>({k:c.k, label:t(c.labelKey), ok:c.test(h)}));
    const matched = checks.filter(c=>c.ok).length;
    const pct = conds.length ? Math.round(matched/conds.length*100) : null;
    return { h, checks, matched, total:conds.length, pct };
  });
  scored.sort((a,b)=>{
    if(a.pct!==b.pct) return (b.pct??-1)-(a.pct??-1);
    return (b.h.expYears||0)-(a.h.expYears||0);
  });
  const hasPerfect = conds.length>0 && scored.length>0 && scored[0].pct===100;
  const list = hasPerfect ? scored.filter(s=>s.pct===100) : scored.slice(0,20);

  const box = document.getElementById('matchResult');
  if(!box) return;
  if(!S.run){ box.innerHTML = `<p class="muted text-sm p-4 card">${t('match.empty')}</p>`; return; }
  if(!scored.length){ box.innerHTML = `<p class="muted text-sm p-4 card">${t('match.noResult')}</p>`; return; }

  const langTxt = h=>`EN:${td(h.langEn)||'—'} / 粵:${td(h.langCt)||'—'} / 普:${td(h.langPtn)||'—'}`;

  box.innerHTML = `
    ${!hasPerfect && conds.length?`<div class="mb-3 rounded bg-orange-100 dark:bg-orange-900/40 text-orange-800 dark:text-orange-200 text-sm font-semibold px-4 py-2">⚠ ${t('match.noPerfect')}</div>`:''}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    ${list.map(s=>`
      <div class="card p-4">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="font-bold">${esc(s.h.engName)} <span class="text-xs muted">(${esc(s.h.code)})</span></div>
            <div class="text-xs muted">${td(s.h.nationality)} · ${t('fdh.age')}: ${calcAge(s.h.birth)} · ${t('fdh.expYears')}: ${s.h.expYears||0} · ${contractBadge(s.h.contract)}</div>
          </div>
          <div class="text-right shrink-0">
            ${s.pct===null?`<div class="text-2xl font-extrabold text-gray-400">—</div>`
              :`<div class="text-2xl font-extrabold ${s.pct>=80?'text-green-600':s.pct>=50?'text-orange-500':'text-gray-400'}">${s.pct}%</div>`}
            <div class="text-xs muted">${t('match.fit')} ${s.matched} ${t('match.of')} ${s.total} ${t('match.items')}</div>
          </div>
        </div>
        <div class="text-xs muted mt-2 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-0.5">
          <div>${t('match.education')}: ${td(s.h.education)||'—'} · ${t('match.marital')}: ${td(s.h.marital)||'—'} · ${t('match.children')}: ${s.h.children||0}</div>
          <div>${t('match.languages')}: ${langTxt(s.h)}</div>
          <div>${t('match.contractDone')}: ${s.h.contractDone||0} · ${t('match.zodiac')}: ${getZodiac(s.h.birth)||'—'} / ${getChineseZodiac(s.h.birth)||'—'}</div>
          <div>${t('fdh.skills')}: ${(s.h.skills||[]).map(td).join('、')||'—'}</div>
        </div>
        ${s.checks.length?`<div class="flex flex-wrap gap-1.5 mt-2 text-xs">
          ${s.checks.map(c=>`<span class="px-2 py-0.5 rounded-full ${c.ok?'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300':'bg-gray-100 text-gray-400 dark:bg-slate-800 dark:text-slate-500'}">${c.ok?'✓':'✗'} ${esc(c.label)}</span>`).join('')}
        </div>`:''}
        <div class="flex gap-2 mt-3 flex-wrap">
          <button class="btn btn-pri !min-h-[36px] !py-1.5 text-xs addCand" data-code="${esc(s.h.code)}"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i>${t('match.addCand')}</button>
          <button class="btn btn-green !min-h-[36px] !py-1.5 text-xs matchWa" data-code="${esc(s.h.code)}"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i>${t('rec.waSend')}</button>
          <button class="btn btn-sec !min-h-[36px] !py-1.5 text-xs" onclick="openFdhDetail(DB.helpers.find(x=>x.code==='${esc(s.h.code)}'))">${t('btn.view')}</button>
          <button class="btn btn-sec !min-h-[36px] !py-1.5 text-xs" onclick="openResume(DB.helpers.find(x=>x.code==='${esc(s.h.code)}'))"><i data-lucide="printer" class="w-3.5 h-3.5"></i>${t('btn.print')}</button>
        </div>
      </div>`).join('')}
    </div>`;
  refreshIcons();

  box.querySelectorAll('.matchWa').forEach(b=>b.onclick=()=>openMatchWa(b.dataset.code));
  box.querySelectorAll('.addCand').forEach(b=>b.onclick=()=>{
    const code = b.dataset.code;
    if(!window.MATCH_CANDS) window.MATCH_CANDS = [];
    if(window.MATCH_CANDS.includes(code)){ toast(t('match.alreadyCand'),'info'); return; }
    window.MATCH_CANDS.push(code); saveCands();
    toast(t('match.addCand')+' ✓ '+code,'ok');
    renderCands();
  });
}

/* ───────── 候選名單（Job Order 移除後嘅替代工作流：直接 WhatsApp 聯絡） ───────── */
function renderCands(){
  const host = document.getElementById('candBox');
  if(!host) return;
  const cands = window.MATCH_CANDS||[];
  if(!cands.length){ host.innerHTML=''; return; }
  const row = c=>{
    const h = DB.helpers.find(x=>x.code===c); if(!h) return '';
    const waBtn = (region,field,lbl)=> h[field]
      ? `<button class="btn btn-green !min-h-[28px] !py-0.5 !px-2 text-xs candWA" data-code="${esc(h.code)}" data-region="${region}">WA ${esc(lbl)}</button>` : '';
    return `<div class="flex items-center gap-2 flex-wrap text-xs border bd rounded-lg px-2.5 py-1.5">
      <b>${esc(h.engName)}</b><span class="muted">${esc(h.code)}</span>
      ${contractBadge(h.contract)}
      <span class="muted">${td(h.nationality)} · ${t('fdh.expYears')}: ${h.expYears||0}</span>
      <span class="ml-auto flex gap-1.5 flex-wrap">
        ${waBtn('HK','phoneHK','HK')}
        ${h.nationality==='PH'?waBtn('PH','phonePH','PH'):waBtn('ID','phoneIndo','ID')}
        <button class="btn btn-sec !min-h-[28px] !py-0.5 !px-2 text-xs candView" data-code="${esc(h.code)}">${t('btn.view')}</button>
        <button class="btn btn-red !min-h-[28px] !py-0.5 !px-2 text-xs candDel" data-code="${esc(h.code)}">${t('match.removeCand')}</button>
      </span>
    </div>`;
  };
  host.innerHTML = `
    <div class="card p-3">
      <div class="flex items-center gap-2 flex-wrap text-sm mb-2">
        <b>${t('match.cands')}</b><span class="badge b-blue">${cands.length}</span>
        <button class="btn btn-sec !min-h-[28px] !py-0.5 !px-2 text-xs" id="btnCopyCands"><i data-lucide="copy" class="w-3.5 h-3.5"></i>${t('match.copyList')}</button>
        <button class="btn btn-sec !min-h-[28px] !py-0.5 !px-2 text-xs" id="btnClearCands">${t('match.clearCands')}</button>
      </div>
      <div class="space-y-1.5">${cands.map(row).join('')}</div>
    </div>`;
  refreshIcons();
  host.querySelectorAll('.candWA').forEach(b=>b.onclick=()=>{
    const h = DB.helpers.find(x=>x.code===b.dataset.code); if(!h) return;
    openFdhWADialog(h, b.dataset.region);
  });
  host.querySelectorAll('.candView').forEach(b=>b.onclick=()=>{
    const h = DB.helpers.find(x=>x.code===b.dataset.code); if(h) openFdhDetail(h);
  });
  host.querySelectorAll('.candDel').forEach(b=>b.onclick=()=>{
    window.MATCH_CANDS = (window.MATCH_CANDS||[]).filter(x=>x!==b.dataset.code);
    saveCands(); renderCands();
  });
  const cp = document.getElementById('btnCopyCands');
  if(cp) cp.onclick = ()=>{
    const txt = cands.map(c=>{
      const h = DB.helpers.find(x=>x.code===c); if(!h) return '';
      const ph = [h.phoneHK, h.nationality==='PH'?h.phonePH:h.phoneIndo].filter(Boolean).join(' / ');
      return `${h.engName} (${h.code})${ph?' — '+ph:''}`;
    }).filter(Boolean).join('\n');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>toast(t('match.copied')+' ✓','ok'), ()=>fallbackCopy(txt));
      } else fallbackCopy(txt);
    }catch(e){ fallbackCopy(txt); }
  };
  const cl = document.getElementById('btnClearCands');
  if(cl) cl.onclick = ()=>{ window.MATCH_CANDS=[]; saveCands(); renderCands(); };
}
function fallbackCopy(txt){
  try{
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast(t('match.copied')+' ✓','ok');
  }catch(e){ toast(txt,'info',8000); }
}
</script>

<!-- ══════════ Script 8：模組三 —— 每日跟進 + 記事板 ══════════ -->
<script>
/* ═════════ 自動提醒（即時運算；完成狀態持久化） ═════════
   reminderKey = 類型 + 實體ID + 到期日 → completedReminders 儲存，明天重開不再彈出 */
function computeReminders(){
  const T = todayStr(); const out = [];
  /* 生日（只計月-日、不計年份、不會逾期）：計下一次生日，生日前 3 天開始提醒 */
  const bdayDue = birth=>{
    if(!birth) return '';
    const md = String(birth).slice(5,10); if(!/^\d{2}-\d{2}$/.test(md)) return '';
    const y = T.slice(0,4); let d = y+'-'+md; if(d < T) d = String(Number(y)+1)+'-'+md;
    return d;
  };
  /* 外傭：每年生日 + Visa 到期日 */
  DB.helpers.forEach(h=>{
    const name = h.nickname || h.engName;
    const bd = bdayDue(h.birth);
    if(bd){
      const d = daysBetween(T, bd);
      if(d>=0 && d<=3){                     /* 只喺生日前 3 日內出現，過咗自動等下一年 */
        const key = 'BDAY|'+h.code+'|'+bd;
        if(!DB.completedReminders[key]) out.push({key, type:'BDAY', kind:'fdh', code:h.code, name,
          item:'🎂 '+t('follow.bday'), due:bd, overdue:0});
      }
    }
  });
  /* 僱主：跟進日期 + 跟進事項 */
  DB.employers.forEach(e=>{
    if(e.expectDate){
      const due = fmtDate(e.expectDate); const d = daysBetween(T, due);
      const key = 'EFU|'+e.code+'|'+due;
      if(!DB.completedReminders[key] && d<=60) out.push({key, type:'EFU', kind:'emp', code:e.code,
        name:e.nickname||e.salutation, item:e.followUp || t('emp.followUp'), due, overdue:Math.max(0,-d)});
    }
  });
  /* 記事板中未完成、有到期日的待辦也納入 */
  DB.notes.forEach(n=>{
    if(!n.done && n.due){
      const due = fmtDate(n.due); const d = daysBetween(T, due);
      const key = 'NOTE|'+n.id+'|'+due;
      if(!DB.completedReminders[key] && d<=60) out.push({key, type:'NOTE', kind:'note', code:n.id,
        name:'📝 '+t('follow.notes'), item:n.text, due, overdue:Math.max(0,-d)});
    }
  });
  out.sort((a,b)=> a.due<b.due?-1:1);
  return out;
}
function renderFollow(){

  el.innerHTML = `
  <div class="card mb-4 overflow-hidden">

      <span class="badge ${overdue.length?'b-red':'b-gray'}">${overdue.length} ${t('follow.overdue')}</span>
      <span class="badge b-blue">${today.length} TODAY</span>
    </div>
    ${overdue.map(remRow).join('')}${today.map(remRow).join('')}

    ${doneKeys.length?`<div class="px-4 py-2 border-t bd">
      <button id="btnViewDone" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold">${t('follow.viewDone')} (${doneKeys.length})</button>
      <div id="doneBox" class="hidden mt-2"></div></div>`:''}
  </div>
  <div class="flex items-center justify-between mb-3">
    <h3 class="font-bold flex items-center gap-2"><i data-lucide="sticky-note" class="w-5 h-5 text-yellow-500"></i>${t('follow.notes')}</h3>
    <button id="btnAddNote" class="btn btn-pri !min-h-[38px] !py-1.5"><i data-lucide="plus" class="w-4 h-4"></i>${t('follow.addNote')}</button>
  </div>
  <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-start"></div>`;
  refreshIcons();
  /* 完成勾選 → 持久化，明天不再彈出 */
  el.querySelectorAll('.remDone').forEach(cb=>cb.onchange=()=>{
    if(cb.checked){ pushUndo(); DB.completedReminders[cb.dataset.key] = nowStamp(); markChange(); toast(t('follow.complete')+' ✓','ok'); renderFollow(); }
  });
  /* 跟進列快速操作：開啟檔案（讀寫資料庫）/ WhatsApp / 一鍵標記已跟進 */
  el.querySelectorAll('.remOpen').forEach(b=>b.onclick=()=>{

  renderNotesGrid();

}
/* ═════════ 每日記事板（Sticky Notes） ═════════ */
function renderNotesGrid(){
  const grid = document.getElementById('notesGrid'); if(!grid) return;
  const sorted = [...DB.notes].sort((a,b)=> (b.pinned-a.pinned) || (a.done-b.done) || (b.updatedAt>a.updatedAt?1:-1));
  grid.innerHTML = sorted.map(n=>`
    <div class="sticky-note ${n.done?'done':''}">
      ${n.pinned?'<div class="pin">📌</div>':''}
      <textarea class="w-full bg-transparent border-0 resize-none text-sm font-medium outline-none" rows="4" data-nt="${n.id}">${esc(n.text)}</textarea>
      ${n.due?`<div class="text-[11px] font-semibold mt-1">⏰ ${t('follow.due')}: ${fmtDate(n.due)}</div>`:''}
      <div class="flex flex-wrap gap-1 mt-2 text-[11px]">
        <button class="px-2 py-1 rounded bg-yellow-600/20 hover:bg-yellow-600/40 font-bold" data-npin="${n.id}">${n.pinned?t('follow.unpin'):t('follow.pin')}</button>
        <button class="px-2 py-1 rounded ${n.done?'bg-gray-600/20':'bg-green-700/25'} hover:bg-green-700/40 font-bold" data-ndone="${n.id}">${n.done?t('follow.undo'):t('follow.complete')}</button>
        <button class="px-2 py-1 rounded bg-red-700/25 hover:bg-red-700/40 font-bold" data-ndel="${n.id}">✕</button>
      </div>
      <div class="text-[10px] opacity-60 mt-1">${fmtDate(n.updatedAt)}</div>
    </div>`).join('') || `<p class="muted text-sm">No notes</p>`;
  grid.querySelectorAll('[data-nt]').forEach(ta=>{ ta.onchange = ()=>{ const n=DB.notes.find(x=>x.id===ta.dataset.nt);
    pushUndo(); n.text=ta.value; n.updatedAt=nowStamp(); markChange(); }; });
  grid.querySelectorAll('[data-npin]').forEach(b=>b.onclick=()=>{ const n=DB.notes.find(x=>x.id===b.dataset.npin);
    pushUndo(); n.pinned=!n.pinned; n.updatedAt=nowStamp(); markChange(); renderNotesGrid(); });
  grid.querySelectorAll('[data-ndone]').forEach(b=>b.onclick=()=>{ const n=DB.notes.find(x=>x.id===b.dataset.ndone);
    pushUndo(); n.done=!n.done; n.updatedAt=nowStamp(); markChange(); renderNotesGrid(); });
  grid.querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>{ const n=DB.notes.find(x=>x.id===b.dataset.ndel);
    openConfirm(t('btn.del'), `<p class="text-sm">${t('form.delConfirm')}</p><p class="text-xs mt-1">${esc(n.text)}</p>`,
      ()=>{ pushUndo(); DB.notes = DB.notes.filter(x=>x.id!==n.id); markChange(); renderNotesGrid(); }); });
}
